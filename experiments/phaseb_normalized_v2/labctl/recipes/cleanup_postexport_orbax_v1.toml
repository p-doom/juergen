name = "phaseb_normalized_v2_cleanup_postexport_orbax_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
test "$REPO" = "$PWD"
case "$REPO" in "$LABCTL_RUN_DIR"/source/juergen_rft) ;; *) exit 90;; esac
/opt/miniforge3/bin/python \
  "$REPO/experiments/phaseb_normalized_v2/postexport_orbax_cleanup.py" "$@"
''', "--"]

[resources]
cpus = 2
mem = "8GB"
time = "00:10:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001"]

[inputs.original]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/checkpoints/franz.srambical/phaseb_normalized_v2_A_to_A_r256_s900_production_control_v1_run_019fb5faf966715194bd16bfeee051cd"
[inputs.recovery]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/checkpoints/franz.srambical/phaseb_normalized_v2_A_to_A_r256_s900_manifest_recovery_v1"
[inputs.export]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/checkpoints/franz.srambical/phaseb_normalized_v2_A_to_A_r256_s900_hf_v1"
[inputs.evaluation]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/eval_logs/franz.srambical/phaseb_normalized_v2_eval_A_to_A_r256_s900_v1_run_019fb71df66776f383d630f5d5763095"

[outputs.result]
type = "eval_result"
marker = "cleanup.json"
alias = "phaseb_normalized_v2_cleanup_postexport_orbax_v1_{run.id}"

[args]
original = "{inputs.original.path}"
recovery = "{inputs.recovery.path}"
export = "{inputs.export.path}"
evaluation = "{inputs.evaluation.path}"
out = "{outputs.result.path}/cleanup.json"

[env]
PYTHONUNBUFFERED = "1"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
