name = "phaseb_normalized_v2_train_A_to_A_r256_s900_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
test "$REPO" = "$PWD"
case "$REPO" in "$LABCTL_RUN_DIR"/source/juergen_rft) ;; *) exit 90;; esac
bash "$REPO/experiments/phaseb_normalized_v2/train.sh" "$@" \
  "--experiment_dir=$REPO/experiments/phaseb_normalized_v2"
''', "--"]

[resources]
gpus = 1
cpus = 12
mem = "150GB"
time = "05:15:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--signal=USR1@600", "--requeue", "--ntasks=1", "--ntasks-per-node=1", "--nodelist=hai003,hai007,hai008", "--deadline=2026-07-31T09:50:00"]

[inputs.dataset]
type = "artifact"
artifact = "phaseb_normalized_v2_fullcall_A_to_A_r256_v1"

[inputs.source_model]
type = "artifact"
artifact = "relative_factorial_reltool_pre_r256_s750_capacity_v1_run_019fb4beda3472b289ae60fc612c1cea"

[inputs.omegalax]
type = "external"
path = "/fast/home/franz.srambical/omegalax"

[outputs.model]
type = "checkpoint"
marker = "train_manifest.json"
alias = "phaseb_normalized_v2_A_to_A_r256_s900_production_control_v1_{run.id}"

[args]
dataset = "{inputs.dataset.path}"
source_model = "{inputs.source_model.path}"
omegalax_repo = "{inputs.omegalax.path}"
output = "{outputs.model.path}"

[env]
HF_HOME = "/fast/project/HFMI_SynergyUnit/p-doom_shared/huggingface"
HF_HUB_OFFLINE = "1"
WANDB_MODE = "offline"
PYTHONUNBUFFERED = "1"
XLA_PYTHON_CLIENT_ALLOCATOR = "cuda_async"
XLA_PYTHON_CLIENT_MEM_FRACTION = "0.8"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
UV_CACHE_DIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/uv_cache"
