name = "phaseb_normalized_v2_eval_warmstart_reltool_pre_r256_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
test "$REPO" = "$PWD"
case "$REPO" in "$LABCTL_RUN_DIR"/source/juergen_rft) ;; *) exit 90;; esac
bash "$REPO/experiments/phaseb_normalized_v2/eval.sh" "$@" \
  "--experiment_dir=$REPO/experiments/phaseb_normalized_v2"
''', "--"]

[resources]
gpus = 1
cpus = 16
mem = "150GB"
time = "00:07:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--signal=USR1@300", "--requeue", "--ntasks=1", "--ntasks-per-node=1", "--nodelist=hai003,hai007,hai008", "--deadline=2026-07-31T09:00:00"]

[inputs.model]
type = "artifact"
artifact = "relative_factorial_reltool_pre_r256_s750_capacity_v1_run_019fb4beda3472b289ae60fc612c1cea"
[inputs.dataset]
type = "artifact"
artifact = "phaseb_normalized_v2_fullcall_A_to_A_r256_v1"
[inputs.raw_gold]
type = "artifact"
artifact = "phaseb_raw_deltatype_v2_build_audit_v1_run_019fb5a5564e7a71b3ad6e55426af463"
[inputs.runtime]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/reinforcement-learning/prime-rl"

[outputs.result]
type = "eval_result"
marker = "eval_manifest.json"
alias = "phaseb_normalized_v2_warmstart_reltool_pre_r256_eval_v1"

[args]
model = "{inputs.model.path}"
model_manifest = "{inputs.model.path}/train_export_manifest.json"
model_stage = "warmstart"
dataset = "{inputs.dataset.path}"
raw_gold = "{inputs.raw_gold.path}"
out = "{outputs.result.path}"
runtime_dir = "{inputs.runtime.path}"

[env]
HF_HOME = "/fast/project/HFMI_SynergyUnit/p-doom_shared/huggingface"
HF_HUB_OFFLINE = "1"
PYTHONUNBUFFERED = "1"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
UV_CACHE_DIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/uv_cache"
LD_PRELOAD = "/fast/home/franz.srambical/.tmp_suite/mihir_ablation/nccl_2.28.3/libnccl.so.2"
