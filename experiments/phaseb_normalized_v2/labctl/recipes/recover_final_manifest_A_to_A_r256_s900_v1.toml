name = "phaseb_normalized_v2_recover_final_manifest_A_to_A_r256_s900_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
test "$REPO" = "$PWD"
case "$REPO" in "$LABCTL_RUN_DIR"/source/juergen_rft) ;; *) exit 90;; esac
/opt/miniforge3/bin/python \
  "$REPO/experiments/phaseb_normalized_v2/recover_final_manifest.py" "$@"
''', "--"]

[resources]
cpus = 4
mem = "32GB"
time = "00:08:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001", "--deadline=2026-07-31T09:50:00"]

[inputs.dataset]
type = "artifact"
artifact = "phaseb_normalized_v2_fullcall_A_to_A_r256_v1"
[inputs.source_model]
type = "artifact"
artifact = "relative_factorial_reltool_pre_r256_s750_capacity_v1_run_019fb4beda3472b289ae60fc612c1cea"
[inputs.failed_output]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/checkpoints/franz.srambical/phaseb_normalized_v2_A_to_A_r256_s900_production_control_v1_run_019fb5faf966715194bd16bfeee051cd"
[inputs.training_log]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/labctl_runs/runs/franz.srambical/run_019fb5faf966715194bd16bfeee051cd/.lab/phaseb_normalized_v2_train_A_to_A_r256_s900_v1_135586.log"

[outputs.model]
type = "checkpoint"
marker = "train_manifest.json"
alias = "phaseb_normalized_v2_A_to_A_r256_s900_manifest_recovery_v1"

[args]
dataset = "{inputs.dataset.path}"
source_model = "{inputs.source_model.path}"
failed_output = "{inputs.failed_output.path}"
training_log = "{inputs.training_log.path}"
output = "{outputs.model.path}"

[env]
PYTHONUNBUFFERED = "1"
JAX_PLATFORMS = "cpu"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
