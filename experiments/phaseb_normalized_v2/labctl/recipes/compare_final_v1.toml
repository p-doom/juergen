name = "phaseb_normalized_v2_compare_final_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
test "$REPO" = "$PWD"
case "$REPO" in "$LABCTL_RUN_DIR"/source/juergen_rft) ;; *) exit 90;; esac
PYTHONPATH="$REPO/experiments/phaseb_normalized_v2" /opt/miniforge3/bin/python \
  "$REPO/experiments/phaseb_normalized_v2/compare_final.py" "$@"
''', "--"]

[resources]
cpus = 2
mem = "8GB"
time = "00:05:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001"]

[inputs.final]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/eval_logs/franz.srambical/phaseb_normalized_v2_eval_A_to_A_r256_s900_v1_run_019fb71df66776f383d630f5d5763095"
[inputs.warmstart]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/eval_logs/franz.srambical/phaseb_normalized_v2_warmstart_reltool_pre_r256_eval_v1"
[inputs.absolute]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/eval_logs/franz.srambical/phaseb_eval_prose_keep_recovery_135312_v1_run_019fb56b2f8379d1a98671befabd0eca"
[inputs.preregistration]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/checkpoints/franz.srambical/phaseb_normalized_v2_A_to_A_r256_s900_manifest_recovery_v1/preregistration.json"

[outputs.result]
type = "eval_result"
marker = "comparison.json"
alias = "phaseb_normalized_v2_compare_final_v1_{run.id}"

[args]
final = "{inputs.final.path}"
warmstart = "{inputs.warmstart.path}"
absolute = "{inputs.absolute.path}"
preregistration = "{inputs.preregistration.path}"
out = "{outputs.result.path}/comparison.json"

[env]
PYTHONUNBUFFERED = "1"
