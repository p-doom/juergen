name = "synthetic_multistep_train_typing_B_perkey_pinned_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
bash "$REPO/experiments/synthetic_multistep/typing_factorial_train_export.sh" "$@"
''', "--"]
[resources]
gpus = 1
cpus = 12
mem = "150GB"
time = "01:30:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--requeue", "--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001,hai008", "--nodelist=hai003,hai004,hai007"]
[inputs.dataset]
type = "artifact"
artifact = "synthetic_typing_factorial_2x2_v1_run_019fb585358c7ff08fe5fbc5dd746e5d"
[inputs.source_model]
type = "artifact"
artifact = "relative_factorial_relraw_pre_r256_s750_capacity_v1_run_019fb4bec0167122b655a36ea3a4237e"
[inputs.omegalax]
type = "external"
path = "/fast/home/franz.srambical/omegalax"
[outputs.model]
type = "checkpoint"
marker = "typing_train_export_manifest.json"
alias = "synthetic_typing_factorial_B_perkey_r256_lr5e5_v1_{run.id}"
[args]
omegalax_repo = "{inputs.omegalax.path}"
dataset = "{inputs.dataset.path}"
source_model = "{inputs.source_model.path}"
output = "{outputs.model.path}"
format = "perkey"
[env]
HF_HOME = "/fast/project/HFMI_SynergyUnit/p-doom_shared/huggingface"
HF_HUB_OFFLINE = "1"
PYTHONUNBUFFERED = "1"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
UV_CACHE_DIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/uv_cache"
