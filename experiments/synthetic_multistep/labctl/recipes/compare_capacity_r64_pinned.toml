name = "synthetic_multistep_phasea_compare_capacity_r64_pinned_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.provenance.repo_path' "$LABCTL_CONTEXT")"
RUNTIME="$(jq -r '.inputs[] | select(.role == "runtime") | .resolved_path' "$LABCTL_CONTEXT")"
"$RUNTIME/.venv/bin/python" "$REPO/experiments/synthetic_multistep/compare.py" "$@"
''', "--"]

[resources]
cpus = 2
mem = "8GB"
time = "00:15:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--requeue", "--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001"]

[inputs.absolute]
type = "artifact"
artifact = "synthetic_multistep_phasea_absolute_primary_v1_run_019fb4f69ebe76a3aef087dd5d95a464"
[inputs.relative]
type = "artifact"
artifact = "synthetic_multistep_phasea_move_rel_r64_capacity_v1_run_019fb50dac337e60a0546f8885e437eb"
[inputs.runtime]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/reinforcement-learning/prime-rl"

[outputs.result]
type = "eval_result"
marker = "comparison.json"
alias = "synthetic_multistep_phasea_capacity_r64_comparison_v1_{run.id}"

[args]
absolute = "{inputs.absolute.path}"
relative = "{inputs.relative.path}"
out = "{outputs.result.path}"
comparison-label = "capacity_sensitivity"

[env]
PYTHONUNBUFFERED = "1"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
