name = "synthetic_multistep_cleanup_curriculum_original_orbax_pinned_v2"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
python3 "$REPO/experiments/synthetic_multistep/cleanup_curriculum_orbax.py" "$@"
''', "--"]

[resources]
cpus = 2
mem = "8GB"
time = "00:30:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--requeue", "--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001"]

[inputs.original_a]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/checkpoints/franz.srambical/synthetic_multistep_curriculum_A_to_B_raw_pre_r256_s750_v1_run_019fb53249dc7cf28e5d5ffe62151507"
