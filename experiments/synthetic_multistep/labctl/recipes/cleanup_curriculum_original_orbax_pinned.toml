[inputs.failed_run_a]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/labctl_runs/runs/franz.srambical/run_019fb53249dc7cf28e5d5ffe62151507"
[inputs.failed_run_b]
type = "external"
