name = "synthetic_proper_vm_stage1_5_paired_comparison_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
test "$REPO" = "$PWD"
case "$REPO" in "$LABCTL_RUN_DIR"/source/juergen_rft) ;; *) exit 90;; esac
PY="$(jq -r '.inputs[] | select(.role == "host_python") | .resolved_path' "$LABCTL_CONTEXT")/bin/python"
ABS="$(jq -r '.inputs[] | select(.role == "absolute") | .resolved_path' "$LABCTL_CONTEXT")"
NORM="$(jq -r '.inputs[] | select(.role == "normalized") | .resolved_path' "$LABCTL_CONTEXT")"
RAW="$(jq -r '.inputs[] | select(.role == "raw_a_to_b") | .resolved_path' "$LABCTL_CONTEXT")"
OUT="$(jq -r '.outputs.result.path' "$LABCTL_CONTEXT")"
"$PY" "$REPO/experiments/synthetic_multistep/proper_vm_stage2/aggregate.py" \
  --absolute "$ABS" --normalized "$NORM" --raw-a-to-b "$RAW" --out "$OUT"
''']

[resources]
cpus = 4
mem = "16GB"
time = "00:10:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--ntasks=1", "--ntasks-per-node=1", "--no-requeue", "--exclude=hai001,hai005", "--deadline=2026-07-31T09:45:00"]

[inputs.absolute]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/eval_logs/franz.srambical/synthetic_proper_vm_stage1_5_absolute_assembled_v1_run_019fb6d69fbb7872a3936fda1b4529db"
[inputs.normalized]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/eval_logs/franz.srambical/synthetic_proper_vm_stage1_5_normalized_assembled_v2_host_python_run_019fb6cdecb370d19ff82e67b1a646b9"
[inputs.raw_a_to_b]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/labctl/eval_logs/franz.srambical/synthetic_proper_vm_stage1_5_raw_a_to_b_assembled_v2_arm_name_fix_run_019fb6cf27a87912a16cc83aa275f046"
[inputs.host_python]
type = "external"
path = "/fast/home/franz.srambical/juergen/.venv"

[outputs.result]
type = "eval_result"
marker = "paired_report.json"
alias = "synthetic_proper_vm_stage1_5_paired_comparison_v1_{run.id}"

[env]
PYTHONUNBUFFERED = "1"
