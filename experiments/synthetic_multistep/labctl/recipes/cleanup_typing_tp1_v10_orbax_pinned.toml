name = "synthetic_multistep_cleanup_typing_tp1_v10_orbax_pinned"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
SOURCE="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
SCRIPT="$SOURCE/experiments/synthetic_multistep/cleanup_typing_tp1_v10_orbax.py"
ALLOWLIST="$SOURCE/experiments/synthetic_multistep/TYPING_TP1_V10_ORBAX_CLEANUP_ALLOWLIST.json"
[[ "$(sha256sum "$SCRIPT" | awk '{print $1}')" == "4c2141da3e50a9d6e603da7ab16ff54fd415b20b3a730de0c4729a97635b554a" ]] || exit 2
python3 "$SCRIPT" \
  --allowlist "$ALLOWLIST" \
  --expected-allowlist-sha256 e62ed3467e85f188f71f027df8e427994526ac8a84009267f88bf7d81ba04357 \
  "$@"
''', "--"]

[resources]
gpus = 0
cpus = 2
mem = "8GB"
time = "00:20:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--no-requeue", "--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001", "--deadline=2026-07-31T12:00:00"]

[outputs.result]
type = "eval_result"
marker = "cleanup.json"
alias = "synthetic_typing_tp1_v10_orbax_cleanup_{run.id}"

[args]
out = "{outputs.result.path}/cleanup.json"

[env]
PYTHONUNBUFFERED = "1"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
