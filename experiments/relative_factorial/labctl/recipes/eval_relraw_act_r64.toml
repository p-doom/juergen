name = "relative_factorial_capacity_eval_relraw_act_r64_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.provenance.repo_path' "$LABCTL_CONTEXT")"
bash "$REPO/experiments/relative_factorial/eval_stage.sh" "$@" \
    "--experiment_dir=$REPO/experiments/relative_factorial"
''', "--"]

[resources]
gpus = 1
cpus = 16
mem = "150GB"
time = "01:00:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--signal=USR1@600", "--requeue", "--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001", "--nodelist=hai003,hai004,hai007"]

[inputs.model]
type = "artifact"
artifact = "relative_factorial_relraw_act_r64_s750_capacity_v1_run_019fb4bf3e987ca38d4813c7a323abff"

[inputs.audit]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/audit_operand"

[inputs.runtime]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/reinforcement-learning/prime-rl"

[outputs.result]
type = "eval_result"
marker = "eval_manifest.json"
alias = "relative_factorial_capacity_eval_relraw_act_r64_v1_{run.id}"

[args]
prime_rl_repo = "{inputs.runtime.path}"
model_path = "{inputs.model.path}/hf"
out = "{outputs.result.path}"
grammar = "deltatype_raw"
preamble = "false"
audit_dir = "{inputs.audit.path}"
lora_rank = "64"
lora_alpha = "64"

[env]
HF_HOME = "/fast/project/HFMI_SynergyUnit/p-doom_shared/huggingface"
HF_HUB_OFFLINE = "1"
PYTHONUNBUFFERED = "1"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
UV_CACHE_DIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/uv_cache"
LD_PRELOAD = "/fast/home/franz.srambical/.tmp_suite/mihir_ablation/nccl_2.28.3/libnccl.so.2"
