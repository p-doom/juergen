name = "relative_factorial_export_absraw_act_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.provenance.repo_path' "$LABCTL_CONTEXT")"
bash "$REPO/experiments/relative_factorial/export_checkpoint.sh" "$@"
''', "--"]
[resources]
cpus = 16
mem = "150GB"
time = "08:00:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--requeue", "--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001"]
[inputs.orbax]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/audit_operand/ckpt/absraw_act_r32_2k/000750"
[inputs.omegalax]
type = "external"
path = "/fast/home/franz.srambical/omegalax"
[outputs.model]
type = "checkpoint"
marker = "export_manifest.json"
alias = "relative_factorial_absraw_act_hf_v1_{run.id}"
[args]
omegalax_repo = "{inputs.omegalax.path}"
checkpoint_path = "{inputs.orbax.path}"
output = "{outputs.model.path}"
arm = "absraw_act"
model_id = "Qwen/Qwen3-VL-8B-Instruct"
[env]
HF_HOME = "/fast/project/HFMI_SynergyUnit/p-doom_shared/huggingface"
HF_HUB_OFFLINE = "1"
PYTHONUNBUFFERED = "1"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
UV_CACHE_DIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/uv_cache"
