name = "stage4_teacher_sft_collect_remote_cpu_kvm_v1"
repo = "juergen_stage4_teacher_sft"
command = ["bash", "-c", '''
set -euo pipefail
SOURCE="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
cd "$SOURCE"
[[ -r /dev/kvm && -w /dev/kvm ]] || { echo "FATAL /dev/kvm unavailable" >&2; exit 2; }
python -m experiments.teacher_sft.cli collect "$@"
''', "--"]

[resources]
gpus = 0
cpus = 16
mem = "64GB"
time = "12:00:00"
qos = "low"
partition = "standard"
account = "hfmi_synergyunit"
sbatch_extra = ["--no-requeue", "--ntasks=1", "--ntasks-per-node=1"]

[inputs.tasks]
type = "stage"
stage = "tasks"
role = "tasks"

[inputs.teacher_spec]
type = "artifact"
artifact = "teacher_sft_absolute_teacher_spec_v1"

[inputs.env_adapter]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/teacher_sft_vm_adapter"

[outputs.rollouts]
type = "dataset"
marker = "manifest.json"
alias = "stage4_teacher_sft_absolute_rollouts_{run.id}"

[args]
tasks = "{inputs.tasks.path}"
teacher-spec = "{inputs.teacher_spec.path}/teacher.json"
env-command = "python {inputs.env_adapter.path}/adapter.py"
output = "{outputs.rollouts.path}"
candidates-per-task = "4"
max-steps = "30"
workers = "4"
success-reward = "1.0"

[env]
PYTHONUNBUFFERED = "1"
TEACHER_API_KEY = "none"
CUDA_VISIBLE_DEVICES = ""
