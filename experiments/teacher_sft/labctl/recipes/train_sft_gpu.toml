name = "stage4_teacher_sft_train_gpu_v1"
repo = "omegalax"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.source_path' "$LABCTL_CONTEXT")"
declare -A A
for arg in "$@"; do k="${arg%%=*}"; A["${k#--}"]="${arg#*=}"; done
mkdir -p "${A[output]}/orbax"
uv run --project="$REPO" -- srun python "$REPO/scripts/train_vlm_sft.py" \
  --model_id="${A[model-id]}" --processor="${A[model-id]}" \
  --data_path="${A[dataset]}/train" --val_data_path="${A[dataset]}/val" \
  --save_dir="${A[output]}/orbax" --enable_lora=true --lora_rank=32 --lora_alpha=32 \
  --freeze_vision_tower=false --tp_size=1 --fsdp_size=1 --dp_size=1 \
  --batch_size=1 --grad_accum_steps=8 --learning_rate=1e-4 --lr_schedule=wsd \
  --lr_stable_fraction=0.7 --lr_end_factor=0 --warmup_steps=30 --weight_decay=0.01 \
  --max_grad_norm=1 --max_length=16384 --num_steps=300 --num_loss_tiles=16 \
  --keep_latest=1 --keep_period=150 --save_every=150 --val_every=150 --val_steps=15 \
  --log_every=10 --resume=if_present --pad_id=0 --seed=0 --text_attn_backend=mosaic_gpu \
  --max_vision_images_per_sample=32 --max_vision_patches_per_sample=64000 \
  --grain_read_threads=4 --grain_read_buffer_size=2 --grain_workers=2 \
  --grain_worker_buffer_size=2 --jax_cache_dir="${A[output]}/jax_cache"
[[ -f "${A[output]}/orbax/000300/_CHECKPOINT_METADATA" ]] || { echo "FATAL final checkpoint missing" >&2; exit 3; }
python - "${A[output]}/train_manifest.json" "${A[dataset]}/manifest.json" <<'PY'
import hashlib,json,sys
source=open(sys.argv[2],'rb').read()
json.dump({'schema_version':1,'artifact_type':'teacher_sft_orbax','step':300,
 'dataset_manifest_sha256':hashlib.sha256(source).hexdigest()},open(sys.argv[1],'w'),sort_keys=True)
PY
''', "--"]

[resources]
gpus = 1
cpus = 12
mem = "150GB"
time = "08:00:00"
qos = "low"
partition = "standard"
account = "hfmi_synergyunit"
sbatch_extra = ["--signal=USR1@600", "--requeue", "--ntasks=1", "--ntasks-per-node=1"]

[inputs.dataset]
type = "stage"
stage = "tokenize"
role = "dataset"

[outputs.model]
type = "checkpoint"
marker = "train_manifest.json"
alias = "stage4_teacher_sft_orbax_{run.id}"

[args]
dataset = "{inputs.dataset.path}"
output = "{outputs.model.path}"
model-id = "Qwen/Qwen3-VL-8B-Instruct"

[env]
HF_HUB_OFFLINE = "1"
PYTHONUNBUFFERED = "1"
XLA_PYTHON_CLIENT_ALLOCATOR = "cuda_async"
XLA_PYTHON_CLIENT_MEM_FRACTION = "0.8"
