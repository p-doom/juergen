name = "stage4_teacher_sft_reject_cpu_v1"
repo = "juergen_stage4_teacher_sft"
command = ["python", "-m", "experiments.teacher_sft.cli", "reject"]

[resources]
gpus = 0
cpus = 2
mem = "8GB"
time = "00:30:00"

[inputs.tasks]
type = "stage"
stage = "tasks"
role = "tasks"

[inputs.rollouts]
type = "stage"
stage = "collect"
role = "rollouts"

[outputs.rejection]
type = "dataset"
marker = "manifest.json"
alias = "stage4_teacher_sft_rejection_{run.id}"

[args]
tasks = "{inputs.tasks.path}"
rollouts = "{inputs.rollouts.path}"
output = "{outputs.rejection.path}"
min-reward = "1.0"
max-per-task = "1"

[env]
CUDA_VISIBLE_DEVICES = ""
