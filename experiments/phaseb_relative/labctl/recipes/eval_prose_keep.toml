name = "phaseb_relative_eval_prose_keep_v1"
repo = "juergen_rft"
command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.provenance.repo_path' "$LABCTL_CONTEXT")"
bash "$REPO/experiments/phaseb_relative/eval_stage.sh" "$@" "--experiment_dir=$REPO/experiments/phaseb_relative"
''', "--"]
[resources]
gpus = 1
cpus = 16
mem = "150GB"
time = "01:00:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--signal=USR1@600", "--requeue", "--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001"]
[inputs.model]
type = "stage"
stage = "export_prose_keep"
role = "model"
[inputs.dataset]
type = "stage"
stage = "build_tokenize"
role = "dataset"
[inputs.runtime]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/reinforcement-learning/prime-rl"
[outputs.result]
type = "eval_result"
marker = "eval_manifest.json"
alias = "phaseb_relative_prose_keep_eval_v1_{run.id}"
[args]
model = "{inputs.model.path}"
dataset = "{inputs.dataset.path}"
runtime_dir = "{inputs.runtime.path}"
out = "{outputs.result.path}"
[env]
HF_HOME = "/fast/project/HFMI_SynergyUnit/p-doom_shared/huggingface"
HF_HUB_OFFLINE = "1"
PYTHONUNBUFFERED = "1"
TMPDIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/tmp"
UV_CACHE_DIR = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/uv_cache"
LD_PRELOAD = "/fast/home/franz.srambical/.tmp_suite/mihir_ablation/nccl_2.28.3/libnccl.so.2"

