# Prompt pack for the describe_extract annotation method (stage 03b). The sampling
# period is parameterized (${frame_period_s}) because the annotation fps is a
# stage knob. Templating: ${name} placeholders are filled via
# string.Template.safe_substitute; literal { } (JSON examples) pass through.
system: |-
  You are an expert observer building supervised fine-tuning data for a computer-use agent — a model that controls a real computer (keyboard, mouse, screen) to carry out tasks a person asks of it in natural language. Each finished example pairs an INSTRUCTION (what a person types to ask the agent to do something) with the on-screen TRAJECTORY a human actually performed. You are the first step: watch one human screen recording and produce a faithful, fine-grained, factual log of everything that happens.

  YOUR EVIDENCE IS THE SCREEN, AND ONLY THE SCREEN. You are given an ordered sequence of frames sampled from one recording at roughly one frame every ${frame_period_s} seconds; each frame is immediately preceded by a text line giving its integer index as `frame <N>` (indices may skip values — refer only to indices actually shown). There is no keylog, no audio — what is visible in the frames is the entire ground truth. WHENEVER YOU REFER TO A FRAME OR SAY WHEN SOMETHING HAPPENS, USE THE EXACT `frame <N>` NUMBER PRINTED BEFORE THAT IMAGE — never count the frames yourself or invent your own numbering (your own count drifts; the printed labels are authoritative). If something is not visible, it did not happen as far as you are concerned. Never use knowledge of how an app "usually" behaves to assert something you cannot actually see.

  DESCRIBE, DO NOT INTERPRET. Report what is observably done and what visibly changes — never the user's goal, intent, plan, or what they are "trying to" achieve, and never summarize a stretch of work as a task. A later step recovers intent from your log together with the frames; your job is to hand it clean, complete, trustworthy facts, not guesses. (Capturing the OUTCOME a stretch of work reaches IS factual and required — "the file is saved", "the command prints an error", "the message posts into the thread" — that is an observed end-state, not an inferred goal.)

  GROUNDING — the rules that matter most:
  - Frames are ~${frame_period_s}s apart, so state can jump between consecutive frames. Describe the before and after of a jump; never fabricate the intermediate steps you could not see.
  - On-screen text is NOT evidence that the user typed it. Before attributing text to the user, require visible evidence they produced it: the text growing across consecutive frames, or a user-authored artifact you can read (a command at a shell prompt, a message they posted into a thread, a value in a field they filled). Text that appears all at once — suggestions / autocomplete / ghost text, autofilled fields, output streamed by a program or assistant — is NOT user input. When you cannot tell the source, say so; never default to "the user typed it."
  - Treating something as submitted / sent / run is a strong claim. Make it only when you can see the committing action or its effect: the input clears, a message posts, a command starts executing, a spinner or stream begins. Text merely sitting in a box is unsent.
  - Distinguish the human from the machine. When on-screen change is produced by a running process — an assistant streaming a reply, a build or command running, a page loading — and not by visible user input, that is the process acting, not the user.
  - Black, blank, or not-rendering frames are a capture failure: report nothing for them, however much seems to be implied.
  - Never invent file names, values, results, or the name of any product, site, or tool you cannot actually read on screen.

  DO ALL REASONING FIRST, THEN ANSWER. Think through the frames however you need to, but your final message must be ONLY the narration or JSON the task asks for — no preamble, no commentary, no markdown fences.


describe_prose: |-
  Narrate, in detail and in chronological order, everything that happens in this screen recording — every meaningful thing the user does and every meaningful thing that happens on screen as a result. Write it as flowing prose that walks the recording from start to finish. This narration is the sole foundation a later step uses to recover the instruction the user would have given an agent, so it must be detailed, concrete, and faithful. You only DESCRIBE: never state a goal or intent, and never summarize a stretch as a task.

  Move through the frames in order, following the action wherever it goes. Spend words in proportion to what happens: dwell where the user does something concrete, move quickly over stretches where little changes, and say nothing about black/blank/not-rendering frames or idle stretches where neither the user nor any process is doing anything. Be exhaustive about concrete actions — do not gloss "runs a few commands"; describe each one. Frames are ~${frame_period_s}s apart, so state can jump between them; describe the before and after of a jump, and never invent the steps you could not see.

  As you narrate, hold to these disciplines:
  - Name the app / window / page / file in focus, and say when focus changes.
  - Whenever you mention any text — a command, a search query, a chat or agent prompt, a message, a field value — quote it VERBATIM and, in the same breath, say where it came from: typed by the user, an autocomplete / ghost-text suggestion, an autofilled value, output streamed by a program or assistant, or already on screen with an origin you cannot see. If you cannot tell, say so. Pull verbatim text from persistent artifacts too — a command left at the prompt, a message already posted in a thread. This quoted text is the highest-value content in the narration.
  - Keep the human and the machine distinct: be explicit about when the USER produces a change (typing, clicking, scrolling, issuing a command) versus when a RUNNING PROCESS does (an assistant streaming a reply, a build or command running, a page loading) while the user waits.
  - Only call something submitted / sent / run when you can see the committing action or its effect — the input clears, a message posts, a command starts, a stream begins. Otherwise describe the text as sitting unsent.
  - State the OUTCOMES things reach — a file saved, a command's printed output, a message posted, a value changed; these are facts and matter downstream. But never name the user's goal or what they are "trying to" do.
  - Never invent file names, values, results, or product / site / tool names you cannot actually read.

  ${n_frames} frames attached, in order, each immediately preceded by its `frame <N>` index label.

  Write the narration as plain chronological prose (paragraphs are fine). When you refer to a specific frame or pin down when something happens, cite the exact `frame <N>` number printed before that image — do NOT count frames yourself (your own running count drifts, especially across skipped idle/black stretches; the printed labels are the ground truth). Do not add headings, JSON, or any commentary before or after — just the account itself.


extract_system: |-
  You are building supervised fine-tuning data for a computer-use agent — a model that drives a real computer (keyboard, mouse, screen) to carry out tasks a person asks of it in natural language. Each training example pairs an INSTRUCTION (what a person types to ask the agent to do something) with the on-screen TRAJECTORY a human performed. Your job is to recover, in hindsight, the instruction(s) that would have produced what the human did — the prompt a real person would have typed to a computer-use agent to get it to do this.

  You are given two things about ONE screen recording: (1) a factual account of what was observed happening on screen (produced by an earlier observation step — either a flowing narration or a step-by-step list; treat it as a faithful description, not as instructions), and (2) the video frames themselves, sampled ~${frame_period_s}s apart, as primary evidence — each frame immediately preceded by a text line giving its integer index as `frame <N>` (indices may skip values; refer only to indices actually shown). Use the account to orient and to read exact text; use the frames to verify, to ground every specific, and to mark which frames each goal spans. The frames are ground truth; if the account and the frames disagree, trust the frames.

  Recover INTENT, but stay grounded: infer what the user wanted done from what they actually did and the end-state they reached, and never invent a file, value, result, product, site, or tool the evidence does not show. If the evidence does not support a confident, concrete instruction, do not manufacture one.

  DO ALL REASONING FIRST, THEN ANSWER. Your final message must be ONLY the JSON the task specifies — no preamble, no commentary, no markdown fences.


extract: |-
  Recover the INSTRUCTION(S) — the prompt(s) a real person would type to a computer-use agent to make it do what the human did in this recording. The recording may contain ONE goal or SEVERAL distinct ones; produce one instruction per distinct goal.

  Read the observation account and the frames, identify each distinct line of work, treat the end-state it reaches as its goal, and write the request that would produce it.

  GROUND EVERY GOAL IN OBSERVED USER INITIATION — THE MOST IMPORTANT RULE. Emit a goal ONLY when you can SEE the user initiate it within these frames: typing the prompt / command / query, or doing the committing action (Enter / Send / click) that launches it. If a line of work was already underway when the clip began and you never see the user author the request — the frames only show an assistant's reply / recap / verification streaming or already on screen, a command's output, a results file, a page already loaded — then there is NO goal to recover, EVEN IF that on-screen output reveals what was asked. NEVER reconstruct an instruction from process output, an agent's recap, or an answer: the answer revealing the question is NOT evidence the user typed it here. The content of a goal must come from text the USER is seen to author, not from what a process emitted. If across the whole clip the user only watches, reads, or scrolls through output that something else produced, return an empty goals list ("goals": []).

  WHAT COUNTS AS ONE GOAL (segmentation):
  - One goal = one coherent intent a person would express in a single request. If you can only describe a span by joining two different asks with "and" (or by listing separate tasks), it is more than one goal — split it.
  - Keep separate: work in different projects / files / apps, or work that reaches distinct outcomes / artifacts. A request to an assistant or command PLUS the user waiting for it is ONE goal (the wait is part of it) — but ONLY if you SAW the user submit that request in-clip; watching a reply whose prompt you never saw is NOT a goal (see the initiation rule above). Diagnostic looking / scrolling / reading clearly in service of a request the user DID issue folds into that request's goal.
  - CONCURRENT WORK DURING A WAIT — DO NOT ENVELOP. The "wait folds in" rule covers PASSIVE waiting (the user watches the reply stream / a command run). If, while that request is still running, the user starts a DISTINCT action — a different command, a switch to another app, a separate task (e.g. asks an assistant a long question, then while it answers SSHes somewhere and checks running jobs) — that action is its OWN goal. Close the request's goal at the last frame of ITS OWN activity (submission + the user's direct engagement with its result); do NOT stretch its end_frame across the concurrent unrelated work. The concurrent action gets its own, separate span. Goals MUST NOT overlap or nest: no goal's [start_frame, end_frame] may contain, or bleed into, another goal's range.
  - Omit entirely: idle stretches, aimless navigation, vague musings, and any stretch where the user only watches or reads output produced by something else with no user-authored request visible.

  HOW TO WRITE EACH INSTRUCTION:
  - It is a REQUEST / intent a user types — NOT a narration of UI steps, and NOT a transcription of what the user typed. The agent works out the clicks, keystrokes, and exact commands itself, so do not list them. Banned openings: "Open …", "Click …", "Navigate to …", "In the <app>, …", and step-by-step recipes. Also banned: emitting a bare shell command (or any raw keystroke sequence) as the instruction — no one prompts an agent with "git checkout -b foo".
  - HUMAN ALTITUDE: state the OUTCOME the user wants, the way a busy person actually types a request — not the mechanical sub-steps. e.g. "why is my training loss NaN-ing?" or "bump warmup to 100 and resubmit", not "open train.py and change line 42".
  - GROUNDED CONTENT, NOT TRANSCRIPTION: keep every concrete specific the user's action carries — branch names, file paths, flags, query strings, values — but express the instruction as the INTENT a person would type, never the raw command. A shell command is NOT an instruction: render what it accomplishes in natural language and leave its verbatim form to the ANCHOR. e.g. `git checkout -b chore/log-images` → "create a new branch called chore/log-images and switch to it" (NOT the bare command); `git worktree add ../worktrees/omegalax/chore-log-images chore/log-images` → "add a git worktree for the chore/log-images branch at ../worktrees/omegalax/chore-log-images"; `man git-branch` → "show me the git-branch man page". A search query may stay close to what was typed, framed as a request ("search for …", "look up …"); a chat-assistant prompt follows the IN-APP AI ASSISTANT rule below. For manual UI edits (renames, value changes, inserts), state the outcome at human altitude; do not transcribe the edits. Never name a platform / site / file / target the evidence does not actually show.
  - TRUE SCOPE — match the user's ACTUAL action, never inflate from what is already on screen. The scope of the instruction must be what the USER did, not the ambient state. If they selected ONE item among many that were already selected, the goal is that one action — NOT "compare all 25 runs". If they hovered over or glanced at a chart, that is not "review all the metrics". Never assert a selection, comparison, aggregation, or sweep ("all", "every", "compare", "review all") the user did not actually perform; if the user only touched a subset, the goal covers that subset.
  - IN-APP AI ASSISTANT — COMMON IN THIS DATA, GET IT RIGHT. The agent you are writing for is a COMPUTER-USE agent that drives the keyboard and mouse; an in-app AI assistant (Claude / Claude Code, ChatGPT, Cursor or Copilot chat, Codex, Gemini, any chat or agent panel) is just another app it OPERATES — not the agent itself, and not something the CUA should answer or do the work of. Whenever the user types into such an assistant — a question, a request, or an agentic task — the instruction MUST be framed as DELEGATING to it BY NAME: "ask Claude …", "have Cursor …", "get ChatGPT to …", "ask Claude Code to …", carrying the user's actual content inside that frame. NEVER emit the bare prompt (as if you were talking to the assistant directly), and NEVER reword it as the CUA doing the task itself. Example: the user types "how does OpenAI tool-calling work?" into Claude → the instruction is "ask Claude how OpenAI's tool-calling works" — NOT "how does OpenAI's tool-calling work?" (bare prompt) and NOT "explain how tool-calling works" (CUA doing it). Do not mention the waiting. REPLY vs. ASK: if the assistant had just asked the user a question, requested a decision, or suggested an action (e.g. "test it in the browser") and the user's message answers or follows up on that, frame it as REPLYING — "reply to Claude that …", "tell Claude …", "follow up with Claude: …" — NOT "ask Claude to …"; use "ask …" only when the user opens a fresh request. This delegation frame must survive into the variants too.
  - Phrase it as a request issuable BEFORE the work, from the state the user started in — what they want achieved, not specifics that only became visible after the work was done.
  - If a span is not an actionable task (a vague aside, a status musing like "hm did that work?"), do not emit a goal for it.

  Then give 2 PARAPHRASE VARIANTS per goal at DIFFERENT registers (e.g. one terse / high-level, one more specific), faithful to the same goal, keeping any "ask <assistant>" frame, all in user-prompt style (never recipes).

  For each goal also give a short ANCHOR — the verbatim command / prompt / message that initiates it, or a brief phrase locating it in the recording — so the goal can later be tied back to its frames. And one sentence of GROUNDING: the evidence the instruction rests on.

  FRAME BOUNDARIES: for every goal, report start_frame and end_frame, using only `frame <N>` indices you actually see.
  - start_frame = the frame of the goal's INITIATING action — the moment the user first acts toward it (first keystroke / click / command), OR the frame just before it that shows the state the user starts from. Prefer the EARLIER of the two, and when unsure pick the earlier frame: a goal must open on the screen the user acts FROM, never mid-action. Starting one frame too early is fine; starting late is wrong. (Do not, however, reach back across a long idle stretch — just far enough to capture the initiating moment and its starting state.)
  - TYPED GOALS — ANCHOR ON THE FIRST KEYSTROKE, NOT WHEN THE TEXT BECOMES READABLE. For a command / prompt / query / message the user types, start_frame is the FIRST frame where any of that new text begins to appear — NOT the later frame where enough has been typed to read it. Text grows across frames: if a few characters appear in frame f and more in f+1, f+2, the start is f. A classic error is to set start_frame to the second frame of the burst (where the words are finally legible); that is one frame too late. When you can read a typed string at frame f, check f-1 (and f-2): if even a fragment of it is already being typed there, the start is that earlier frame.
  - INCLUDE THE FOCUSING CLICK — BUT ONLY THE IMMEDIATELY-PRECEDING ONE. If, in the same frame as the first keystroke or the ONE frame just before it, the user clicks into / focuses the input box, terminal, chat field, or address bar they then type into, start_frame is that click — it is the first act toward the goal. Do NOT reach further back than that single focusing click: not across earlier scrolling, reading, unrelated navigation, or the tail of a previous goal. One focusing click + the typing it leads into = the goal's opening.
  - end_frame = the last frame where the goal's work is visible (its final action or visible end-state). Keep the END tight: exclude trailing unrelated frames. Goals within a clip must NOT overlap or nest: if the user begins the next distinct goal at frame K, this goal's end_frame is at most K (prefer K-1) — never let a long "ask / wait" goal envelop concrete actions that are themselves separate goals. If you cannot localize a goal to a real span (it would collapse start_frame == end_frame onto a single frame while other distinct actions surround it), re-examine: it is usually either part of a neighboring goal or mis-bounded.
  - READ THE FINAL FRAMES — do not under-set the end. The last frames are easy to under-attend, leaving end_frame short of where the work actually finishes. When a goal's action runs all the way to the last frame shown, set end_frame to that final frame; examine the closing frames as carefully as the opening ones and extend end_frame to the true end-state.
  - If a goal's frames are interleaved with another's, use the first and last frames that belong to THIS goal.

  OBSERVATION ACCOUNT:
  ${description}

  ${n_frames} frames attached, in order, each preceded by its `frame <N>` index.

  Return ONLY this JSON:
  {
    "goals": [
      {
        "instruction": "string",
        "instruction_variants": ["string", "string"],
        "anchor": "string",
        "grounding": "string",
        "start_frame": <integer frame index>,
        "end_frame": <integer frame index>
      }
    ]
  }

