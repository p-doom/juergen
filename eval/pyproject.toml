[project]
name = "crowdcast-eval"
version = "0.1.0"
description = "Crowd-cast SFT evaluation harnesses (IFEval and OSWorld). Configs consumed by pmanager."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
# sglang's torch/flashinfer wheels target 3.12 today; pin until they support 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "absl-py>=2.0",
    "ml_collections>=1.1",
    # Heavy CUDA stack. Stock sglang 0.5.x — the `[all]` extra pulls in
    # torch, transformers 5.x, flashinfer, sgl-kernel, fastapi, uvicorn,
    # xgrammar, etc. Without the extra, sglang installs as a thin client
    # only (no server runtime). We used to pin a JustinTong0323 fork
    # because sglang 0.4.x pinned transformers 4.55-4.57.x
    # (huggingface-hub<1.0), which conflicted with inspect-evals's
    # huggingface-hub>=1.0 floor. That conflict is gone since
    # transformers 5.x requires huggingface-hub>=1.5; back to upstream.
    # torch pinned directly so [tool.uv.sources] at the workspace root
    # can redirect it to the cu128 wheel index. Without an explicit
    # mention here it's transitive-only and sources don't apply.
    "torch",
    "torchaudio",
    "torchvision",
    "torchcodec",
    # Upper-bound sglang at <0.5.11: sglang 0.5.12 requires
    # cuda-python>=13.0 which forces a CUDA 13 torch wheel, but the hai
    # nodes' NVIDIA driver (12080) only supports CUDA 12.8. Until either
    # the cluster drivers move or sglang relaxes the cuda-python floor,
    # we stay on the CUDA-12-compatible 0.5.x line.
    "sglang[all]>=0.5,<0.5.11",
    "inspect-ai>=0.3.213",
    "inspect-evals>=0.10",
    # inspect-ai's SGLang model provider requires openai>=2.26.0, but sglang
    # pins openai==2.6.1 — override to a recent enough client.
    "openai>=2.26.0",
    "instruction_following_eval @ git+https://github.com/josejg/instruction_following_eval",
    # OSWorld upstream runner (osworld_*_runner.py):
    "pillow>=10",         # screenshot decode in osworld_*_runner.py
    "requests>=2.31",     # in-VM Flask agent client (screenshot/execute/cursor)
    # OSWorld upstream agent/env runtime deps (imported by mm_agents.qwen3vl_agent
    # and desktop_env.* respectively). We don't install OSWorld's heavy DL pins
    # (torch / transformers / easyocr / pymupdf / etc.) — the agent talks to a
    # remote OpenAI-compat endpoint (our sglang) and the evaluator we care
    # about (exact_match over vm_command_line) doesn't touch ML libs. Add
    # more here if a richer evaluator throws ImportError.
    "dashscope>=1.20",            # imported by mm_agents.qwen3vl_agent (Aliyun SDK)
    "backoff",                    # retry decorator
    "google-api-core",            # exception types used by backoff guard
    "gymnasium>=0.28",            # desktop_env.DesktopEnv base class
    "wrapt_timeout_decorator",    # lib_run_single per-step timeout
    "pyautogui>=0.9",             # transitive: imported by OSWorld upstream agent/env modules
    "rapidfuzz",                  # evaluator string matching
    "json_repair",                # tolerant tool-call JSON parsing in some agents
    "lxml",                       # accessibility-tree parsing
    "cssselect",                  # ditto
    "xmltodict",                  # ditto
    "requests_toolbelt",          # in-VM HTTP client multipart
    "fabric>=3",                  # SSH-style remote exec
    "pynput>=1.7",                # input-event types
    "tldextract",                 # chrome evaluators URL parsing
    "chardet",                    # text-encoding detection
    "pytz",                       # tz utilities in misc evaluator getters
    # desktop_env.evaluators.{getters,metrics}.__init__ eagerly imports
    # every evaluator type. We only use exact_match for our task but the
    # full import chain needs all of these resolvable.
    "playwright",                 # chrome evaluator
    "pydrive",                    # gdrive evaluator
    "python-dotenv",              # setup_controller
    "beautifulsoup4",             # html parsing in evaluators
    "opencv-python-headless",     # image-similarity evaluators
    "python-docx",                # docx evaluator
    "python-pptx",                # impress evaluator
    "openpyxl",                   # calc evaluator
    "PyPDF2",                     # pdf evaluator
    "pypdf",                      # pdf evaluator (newer fork)
    "pdfplumber",                 # pdf table extraction
    "pymupdf",                    # `fitz` module
    "imagehash",                  # image similarity
    "scipy",                      # numerics
    "scikit-image",               # `skimage` module
    "formulas",                   # excel formula parsing
    "fastdtw",                    # audio dtw
    "odfpy",                      # `odf` module (OpenDocument)
    "mutagen",                    # audio metadata
    "pyacoustid",                 # `acoustid` audio fingerprint
    "pyyaml",                     # yaml parsing
    "librosa",                    # audio loading (heavy; needed for vlc evals)
    "easyocr",                    # OCR (heavy; needed for some evals)
    "borb",                       # pdf parsing
]

# [tool.uv] prerelease="allow" and override-dependencies live at the
# workspace root (juergen/pyproject.toml) — uv applies workspace-level uv
# config to all members.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Not a published package — pyproject anchors a uv venv at this directory.
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
]
ignore = [
    "PLR0912",  # too many branches (runner main() loops are long by design)
    "PLR0913",  # too many arguments (absl flags-based entrypoints have many)
    "PLR0915",  # too many statements (rollout loops are long by nature)
    "PLR2004",  # magic value (port numbers, timeouts inline are fine)
    "E501",     # line length (enforced by formatter, not lint)
]

[tool.ruff.lint.isort]
known-first-party = [
    "hf_complete", "inspect_ai_patches", "inspect_runner",
    "result", "sglang_runner",
]
