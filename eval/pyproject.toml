[project]
name = "juergen-cua-micro-eval"
version = "0.1.0"
description = "The 18-task CUA action-parity micro-evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "desktop",
    "juergen",
    "pillow>=10",
    "requests>=2.31",
    "sglang==0.5.10.post1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "wandb>=0.19",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.6"]

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
    "sentry-sdk<3",
]

[tool.uv.sources]
desktop = { git = "https://github.com/p-doom/desktop.git", rev = "1db6ae2499afc16d87dee15453a57042dff13f64" }
juergen = { path = ".." }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
