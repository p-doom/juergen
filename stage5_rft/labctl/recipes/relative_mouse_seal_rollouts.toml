name = "stage5_relative_mouse_seal_rollouts_v1"
repo = "juergen_relative_onpolicy_postcollection"

command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.provenance.repo_path' "$LABCTL_CONTEXT")"
SHARD0="$(jq -er '.inputs[] | select(.role == "shard0") | .resolved_path' "$LABCTL_CONTEXT")"
SHARD1="$(jq -er '.inputs[] | select(.role == "shard1") | .resolved_path' "$LABCTL_CONTEXT")"
SHARD2="$(jq -er '.inputs[] | select(.role == "shard2") | .resolved_path' "$LABCTL_CONTEXT")"
OUT="$(jq -er '.outputs.rollouts.path' "$LABCTL_CONTEXT")"
uv run --project="$REPO/stage5_rft" -- python -m stage5_rft.cli seal-relative-mouse-batch \
  --shard "$SHARD0" --shard "$SHARD1" --shard "$SHARD2" --out "$OUT" \
  --expected-tasks 1536 --expected-k 8 --minimum-accepted 1200 \
  --expected-train-seed 1001
jq -e '.status == "complete" and .attempts == 12288 and .errors == 0
  and .accepted >= 1200 and .adaptive_resampling == false
  and .contains_official_heldout == false
  and .contains_real_vm_eval == false
  and .contains_crowd_cast == false' "$OUT/manifest.json"
''']

[resources]
gpus = 0
cpus = 4
mem = "16GB"
time = "00:20:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"

[inputs.shard0]
type = "stage"
stage = "collect_shard0"
role = "rollouts"

[inputs.shard1]
type = "stage"
stage = "collect_shard1"
role = "rollouts"

[inputs.shard2]
type = "stage"
stage = "collect_shard2"
role = "rollouts"

[outputs.rollouts]
type = "dataset"
marker = "manifest.json"
alias = "relative_mouse_pilot_rollouts_{run.id}"
