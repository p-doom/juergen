name = "stage5_relative_mouse_collect_shard2_v1"
repo = "juergen_relative_onpolicy_launch"

command = ["bash", "-c", '''
set -euo pipefail
REPO="$(jq -r '.provenance.repo_path' "$LABCTL_CONTEXT")"
GATE="$(jq -er '.inputs[] | select(.role == "gate") | .resolved_path' "$LABCTL_CONTEXT")"
PARENT="$(jq -er '.inputs[] | select(.role == "parent") | .resolved_path' "$LABCTL_CONTEXT")"
OUT="$(jq -er '.outputs.rollouts.path' "$LABCTL_CONTEXT")"
bash "$REPO/stage5_rft/scripts/collect_relative_mouse_shard.sh" \
  "$GATE/gate_report.json" "$PARENT" "$OUT" 2 "$REPO"
''']

[resources]
gpus = 1
cpus = 16
mem = "100GB"
time = "01:00:00"
qos = "low"
account = "hfmi_synergyunit"
partition = "standard"
sbatch_extra = ["--ntasks=1", "--ntasks-per-node=1", "--exclude=hai001"]

[inputs.gate]
type = "stage"
stage = "feasibility_gate"
role = "report"

[inputs.parent]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/onpolicy_distill/checkpoints/fmt_sft_8b_osw_moverel_hf"

[outputs.rollouts]
type = "dataset"
marker = "sample_manifest.json"
alias = "relative_mouse_pilot_shard2_{run.id}"
