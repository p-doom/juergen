[project]
name = "juergen"
version = "0.1.0"
description = "Crowd-cast SFT supply-chain monorepo: data pipeline, eval harnesses, and the opd-slime venv builder. The model trainer (omegalax) is a separate generic library, kept as its own repo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=16.1.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.uv.workspace]
members = ["data_pipeline", "eval"]

[tool.uv]
prerelease = "allow"
override-dependencies = [
    "openai>=2.26.0",
    "nvidia-cudnn-cu12>=9.16",
]

# Force the torch stack to come from PyTorch's cu128 wheel index. The hai
# nodes have NVIDIA driver 12080 (CUDA 12.8); the default PyPI/PyTorch
# index for torch 2.11.0 ships +cu130 wheels that the driver rejects with
# "No accelerator available". cu128 wheels are runtime-compatible.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
