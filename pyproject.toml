[project]
name = "juergen"
version = "0.1.0"
description = "Crowd-cast SFT supply-chain monorepo: data pipeline, eval harnesses, and the opd-slime venv builder. The model trainer (omegalax) is a separate generic library, kept as its own repo."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["data_pipeline", "eval"]

[tool.uv]
prerelease = "allow"
override-dependencies = [
    "openai>=2.26.0",
    "nvidia-cudnn-cu12>=9.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
