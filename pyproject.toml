[project]
name = "juergen"
version = "0.1.0"
description = "Crowd-cast SFT supply-chain monorepo: data pipeline, action grammars, and the closed-loop eval harness. The model trainer (omegalax) is a separate generic library, kept as its own repo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "desktop",
    "av>=16.1.0",
    "verifiers==0.2.1",
]

[project.optional-dependencies]
# Test-only.
dev = ["pytest>=8"]

# One entry per grammar directory under grammars/. This table plus the directory is
# the registration.
[project.entry-points."juergen.grammars"]
compact_absolute = "grammars.compact_absolute.codec:CODEC"
compact_raw = "grammars.compact_raw.codec:CODEC"
deltatype_v2 = "grammars.deltatype_v2.codec:CODEC"
diffabs = "grammars.diffabs.codec:CODEC"
move_rel = "grammars.move_rel.codec:CODEC"
native_absolute = "grammars.native_absolute.codec:CODEC"
ordered_events_v3 = "grammars.ordered_events_v3.codec:CODEC"

[tool.uv.workspace]
members = ["data_pipeline"]

[tool.uv]
prerelease = "allow"
override-dependencies = [
    "openai>=2.26.0",
]

# No torch is resolved here. If anything needs it again, restore all of it together:
# the `pytorch-cu128` explicit index (the hai nodes' driver 12080 rejects the default
# +cu130 wheels), the torch/torchaudio/torchvision/torchcodec source redirects onto
# it, and the nvidia-cudnn-cu12 override.

[tool.uv.sources]
# Pinned by rev, not by path: labctl stages one repository, so `../desktop` is absent
# from a dispatched run's snapshot and a path source cannot resolve there. A desktop
# commit is invisible here until this rev is bumped and `uv lock` re-run.
desktop = { git = "file:///fast/project/HFMI_SynergyUnit/p-doom_shared/git/desktop.git", rev = "5ed77a58b821be6dc02522f9fc1c998d230f5f59" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# verifiers 0.2.1 cannot resolve a dotted plugin id, so each is a module at the repo
# root -- and a root module is not a package, so `packages.find` never sees it.
py-modules = [
    "osworld_bench",
    "rl_grounding",
    "rl_movebox",
    "rl_target_box",
    "signoflife",
]

[tool.setuptools.packages.find]
# The import closure of those five root modules. pipeline/ is absent: labctl invokes
# its stages as file paths in a checkout, nothing imports it.
include = ["agent", "agent.*", "evals", "evals.*", "grammars", "grammars.*", "rl", "rl.*"]

[tool.setuptools.package-data]
"*" = ["vectors/*.json"]
# Read beside its module, so a wheel built from the tree must carry it.
"evals.signoflife" = ["suite.json"]
