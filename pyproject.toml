[project]
name = "juergen"
version = "0.1.0"
description = "Crowd-cast SFT supply-chain monorepo: data pipeline, eval harnesses, and the opd-slime venv builder. The model trainer (omegalax) is a separate generic library, kept as its own repo."
requires-python = ">=3.12,<3.13"
dependencies = [
    # grammars/ hard-imports desktop_env: `_support.py` takes Operation and
    # DisplayGeometry from it, and every codec's `compile` signature names
    # DisplayGeometry. Without this line `import grammars` raised
    # ModuleNotFoundError on a clean install of this package, which is the worst
    # shape of packaging bug -- the wheel builds, installs, and then fails at the
    # first import.
    "desktop-env",
    "av>=16.1.0",
]

[project.optional-dependencies]
# Test-only. `pytest grammars/` runs the grammar conformance vectors, which need
# nothing but desktop-env; keep this extra that cheap so the gate is runnable
# without resolving the training stack.
dev = ["pytest>=8"]

# One entry per grammar directory under grammars/. This table plus the
# directory IS the registration — nothing else in the repo enumerates grammars,
# and grammars/__init__.py falls back to scanning peer directories so an
# uninstalled checkout still discovers a new one.
[project.entry-points."juergen.grammars"]
compact_raw = "grammars.compact_raw.codec:CODEC"
deltatype_v2 = "grammars.deltatype_v2.codec:CODEC"
diffabs = "grammars.diffabs.codec:CODEC"
move_rel = "grammars.move_rel.codec:CODEC"
native_absolute = "grammars.native_absolute.codec:CODEC"
native_absolute_control = "grammars.native_absolute_control.codec:CODEC"
ordered_events_v3 = "grammars.ordered_events_v3.codec:CODEC"

[tool.uv.workspace]
members = ["data_pipeline", "eval"]

[tool.uv]
prerelease = "allow"
override-dependencies = [
    "openai>=2.26.0",
    "nvidia-cudnn-cu12>=9.16",
]

# Force the torch stack to come from PyTorch's cu128 wheel index. The hai
# nodes have NVIDIA driver 12080 (CUDA 12.8); the default PyPI/PyTorch
# index for torch 2.11.0 ships +cu130 wheels that the driver rejects with
# "No accelerator available". cu128 wheels are runtime-compatible.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# desktop-env is a sibling checkout with NO REMOTE AND NO INDEX PRESENCE, so a
# path is the only way to resolve it. It is not a workspace member: it is its own
# repository, deliberately, because its whole design constraint is one runtime
# dependency (Pillow) and folding it into this workspace would put the training
# stack's resolver in the same room as the VM layer.
#
# The path IS the pin for now. THE MOMENT desktop-env HAS A REMOTE, replace this
# with `{ git = ..., rev = ... }` or a version specifier: a path source resolves
# to whatever is on disk, so two checkouts of juergen at the same commit can
# install different desktop-env code and nothing records which.
#
# AND WHEN IT GETS THAT REMOTE, CONSIDER RENAMING IT. `desktop-env` is already
# taken on PyPI by xlang-ai/desktop_env (OSWorld) -- same distribution name AND
# same import name, different package. This source entry is only read by uv, so
# `pip install .` resolves the dependency from PyPI instead, installs OSWorld's
# package, and the first codec import fails on a missing `desktop_env.geometry`.
# `grammars/_support.py` catches that and says what actually happened, but the
# durable fix is a name nobody else owns.
#
# Not editable on purpose. An editable path source makes this package's installed
# behaviour change when a sibling directory is edited, which is convenient while
# developing both and wrong as a default -- it is also the opposite of how the
# version pin that replaces it will behave. Developers working on both do
# `uv pip install -e ../desktop-env` explicitly, and that overrides this.
desktop-env = { path = "../desktop-env" }

torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["grammars", "grammars.*"]

[tool.setuptools.package-data]
"*" = ["vectors/*.json"]
