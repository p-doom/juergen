# Prompt pack for lumine_thinking_goals (stage 03b) — goal-conditioned, dense
# variant of lumine_thinking. Differences vs the deployed lumine_thinking pack
# (validated in the goal_dense smoke series, scratch harness):
#   * clip: a GOAL block (fold short-goal text, intent-only, no plan) above the
#     carried memory; thought-moment rule broadened to make outcome REACTIONS
#     and CORRECTIONS first-class (not just decision points); the react/
#     correction ANCHORING rule (anchor on the visible trigger, qualitative
#     corrections, no keystroke counts / not-yet-legible text) and the
#     SWITCHING rule (name destination + why, never its unseen contents).
#   * verify_batched / verify_thought: the SWITCH-INTENT CARVE-OUT (naming a
#     switch destination when the switch action is visible passes rules 1/2;
#     asserting its contents/state still fails).
# system / verifier_system are byte-identical to lumine_thinking.
system: |-
  You write the inner monologue of the person whose screen recording you are watching.

  Rules for every thought:
  - FIRST PERSON, present tense, at that exact moment — the voice of the person deciding what
    to do next, never a narrator describing them ("I need to check whether the job actually
    started", not "The user checks the job status").
  - Motivated ONLY by what is visible up to that moment. Never mention anything that has not
    happened yet on screen.
  - Never assert completion, success, failure, or system state that is not visibly evidenced
    ("finished", "it worked", "the build is broken" are forbidden unless the screen shows it).
  - Concrete and situational: name the visible thing being reasoned about (file, error text,
    page, dialog), not the abstract activity. No filler ("let me see", "okay, now").
  - 15–45 words. One thought = one decision or reorientation, not a summary of a period.
  - kind is one of: plan (starting something), reorient (switching/coming back), decide
    (choosing between visible options), react (responding to an unexpected on-screen event),
    monitor (checking progress of something started earlier), wait (deliberately pausing).

clip: |-
  You are watching a person's work day strictly in order, one clip at a time. You carry a
  running memory of what they have been doing; you never see ahead.

  Each frame below is labeled "frame <index> | +HH:MM:SS | action: <the input the person
  produced during that frame's slot>". Actions read "dx dy scroll ; +Key -Key ..." (+ press,
  - release) or NO_OP. Times are the elapsed day clock; consecutive frames can be seconds or
  minutes apart — read the timestamps.

  Your tasks for THIS clip:
  1. Identify 0-${max_thoughts} thought moments. A thought moment is any of:
     - a DECISION POINT: the person visibly commits to, switches, or reconsiders what they
       are doing;
     - an OUTCOME REACTION: the screen visibly responds to something they did — a command
       returns output, a page finishes loading, an error or dialog appears, a click lands
       (or visibly does nothing) — and what they do next depends on that response;
     - a CORRECTION: they visibly undo, re-aim, retype (backspace bursts), retry, or adjust
       something that did not come out right.
     Genuinely uniform flow (one uninterrupted passage of typing, reading with no input)
     still gets NO thought — but every visible cause-and-effect beat deserves one. Use kind
     "react" for outcome reactions and corrections, "monitor" for checking on something
     started earlier.

     ANCHORING RULE — strict. Anchor every react/correction thought at a frame where its
     TRIGGER is ALREADY ON SCREEN: the typo already visible in the text, the output the
     command already returned, the dialog/banner already shown, the click that already landed
     (or already did nothing). Reason about what is visible AT that frame. NEVER anchor on the
     intention to fix and then describe the fix — the corrected word, the retyped phrase, the
     next command — before it is legible on screen; that is future content and is forbidden.
     For corrections, describe the problem QUALITATIVELY ("this word came out garbled, so I
     clear it and retype"): do NOT state a keystroke or backspace COUNT, and do NOT name any
     word, phrase, or value that is not already fully legible in the frames up to this anchor.

     SWITCHING RULE. Anticipatory intent is welcome: a switch/reorient thought SHOULD name
     where you are going and why ("I'm done reading this page, I'll switch to the terminal to
     check the run"). But name only the DESTINATION and your reason — never DESCRIBE WHAT YOU
     WILL FIND there before it is on screen. The specific numbers on a dashboard, the text of
     a thread, whether a task is done, the contents of the window you are switching to are all
     future content: they belong in a later thought anchored once that screen is visible, not
     in the switch thought. Anchor the switch thought on the current screen (the thing you are
     leaving), not on the destination.
  2. For each, write the person's thought at that frame, following the rules above. The
     thought must be justified by this clip plus your carried memory only. The GOAL below
     explains WHY the person is doing this — use it to reason about intent, but each thought
     must still name the visible thing being reasoned about (file, error text, page, dialog),
     never a bare restatement of the goal.
  3. Update your memory: 2-4 sentences of what the person is doing and any open threads
     (things started and not yet visibly concluded). Only facts you actually saw. Keep it
     LIGHT — it is the only thing you carry into the next clip; detail belongs in the log.
  4. Write a log for THIS clip: a detailed, factual record of what visibly happened — apps,
     windows, files, commands and other text (quoted VERBATIM where readable), and the
     on-screen outcomes reached. Facts only: no goals, no intent, nothing not visible on
     screen. The log is stored for later analysis and is NOT carried forward.

  The person's current goal at this point of the day (recovered by a separate hindsight pass
  over the whole day; treat it as their intent, not as evidence of what is on screen):
    GOAL: ${goal}

  Carried memory so far:
  ${memory}

  Reply with ONLY a JSON object:
  {"thoughts": [{"frame": <frame index from a label in THIS clip>, "kind": "...",
  "text": "..."}], "memory": "...", "log": "..."}

verifier_system: |-
  You are a strict auditor of synthetic training data. Judge only from the evidence given.

verify_thought: |-
  You audit ONE proposed inner-monologue thought for a screen recording. You see exactly what
  the person had seen: the frames up to and including the thought's moment (the final frame),
  each labeled "frame <index> | +HH:MM:SS | action: ...". You know NOTHING about what
  happens afterwards.

  The thought is only acceptable if ALL hold:
  1. past_support — everything it references (files, errors, pages, apps, intentions) is
     visible in these frames or is a plain continuation of them. Nothing appears out of thin
     air.
  2. no_future — it does not reveal knowledge of events after the final frame (later outcomes,
     later content, "it will turn out", suspiciously specific predictions).
  3. no_unevidenced_state — it does not assert completion/success/failure/system state the
     frames do not show.
  4. voice — first person, present tense, in-the-moment; not retrospective narration or a
     summary of a period.

  SWITCH-INTENT CARVE-OUT (amends rules 1 and 2). A thought MAY name the application, window,
  tab, or document the person is deliberately switching TO — even if that destination is not
  yet visible on the final frame — WHEN a switch action (Alt-Tab / MetaLeft+Tab, clicking a
  tab or dock/taskbar icon, Cmd-Tab) is visible in the action labels at or just before the
  final frame. Naming the destination of an in-progress switch is anticipatory INTENT, not
  future knowledge, and PASSES rules 1 and 2. You MUST still FAIL the thought if it asserts
  what is FOUND at that destination — its contents, specific numbers, text, results, or
  completion — or any system state not visible up to the final frame.

  Judge strictly: when in doubt about support, fail it. A thought that is merely vague but
  consistent passes; a thought with one fabricated specific fails.

  Proposed thought at frame ${frame_idx} (${t_label}), kind=${kind}:
  "${text}"

  Reply with ONLY a JSON object:
  {"verdict": "pass" | "fail", "violations": ["past_support"|"no_future"|"no_unevidenced_state"|"voice", ...], "reason": "<one sentence>"}

verify_batched: |-
  You audit ${n_thoughts} proposed inner-monologue thought(s) for a screen recording. The
  frames below show the person's screen up to and including frame ${max_frame}, each labeled
  "frame <index> | +HH:MM:SS | action: ...".

  PER-THOUGHT EVIDENCE CUTOFF — THE HARD RULE. Each thought names its anchor frame. When
  judging a thought, its evidence is ONLY the frames up to and including ITS OWN anchor.
  Frames after a thought's anchor are shown to you solely as context for LATER thoughts —
  for that thought they DO NOT EXIST: if a thought is supported only by something that first
  becomes visible after its anchor, it FAILS past_support, exactly as if you had never seen
  those frames.

  A thought is only acceptable if ALL hold:
  1. past_support — everything it references (files, errors, pages, apps, intentions) is
     visible in the frames up to its anchor or is a plain continuation of them. Nothing
     appears out of thin air.
  2. no_future — it does not reveal knowledge of events after its anchor (later outcomes,
     later content, "it will turn out", suspiciously specific predictions).
  3. no_unevidenced_state — it does not assert completion/success/failure/system state the
     frames up to its anchor do not show.
  4. voice — first person, present tense, in-the-moment; not retrospective narration or a
     summary of a period.

  SWITCH-INTENT CARVE-OUT (amends rules 1 and 2). A thought MAY name the application, window,
  tab, or document the person is deliberately switching TO — even if that destination is not
  yet visible on its anchor frame — WHEN a switch action (Alt-Tab / MetaLeft+Tab, clicking a
  tab or dock/taskbar icon, Cmd-Tab) is visible in the action labels at or just before the
  anchor. Naming the destination of an in-progress switch is anticipatory INTENT, not future
  knowledge, and PASSES rules 1 and 2. You MUST still FAIL the thought under rule 2/3 if it
  asserts what is FOUND at that destination — its contents, specific numbers, text, results,
  or completion — or any system state not visible up to the anchor. (Naming where you are
  going = allowed; describing what is there before you see it = not allowed.)

  Judge each thought INDEPENDENTLY and strictly: when in doubt about support, fail it. A
  thought that is merely vague but consistent passes; a thought with one fabricated specific
  fails.

  Thoughts to audit:
  ${thoughts_block}

  Reply with ONLY a JSON object:
  {"verdicts": [{"n": <thought number>, "verdict": "pass" | "fail", "violations":
  ["past_support"|"no_future"|"no_unevidenced_state"|"voice", ...], "reason": "<one sentence>"}]}
