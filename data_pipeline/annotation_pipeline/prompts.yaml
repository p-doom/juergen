# Prompts for the hindsight annotation pipeline (stage_02_annotate.py) and the
# independent quality judge (judge.py). Edit these to iterate on annotation
# quality without touching Python.
#
# Templating: ${name} placeholders are filled via string.Template.safe_substitute
# in annotation_pipeline.prompts.render(). Numbers are pre-formatted by the caller
# (e.g. ${start_s} already reads "12.3"); literal { } (JSON examples) are passed
# through untouched. After editing a step's prompt, re-run only that step with
#   run_iteration ... --refresh <step>   (steps: perceive, segment, label, verify)

# Shared system framing for every stage-02 pass.
system: |-
  You are building supervised fine-tuning data for a computer-use agent. Each training example pairs an INSTRUCTION (what a human types to tell the agent what to do) with the screen-and-action TRAJECTORY the human actually performed. Your job is to recover, in hindsight, the instruction that would have produced the observed behavior — NOT to describe the recording.

  You are given, for a span of one screen recording:
    - ordered video frames; each frame is immediately preceded by a text line giving its true time as `original_t=..s` (the time is provided as text, not drawn on the image);
    - an INPUT TRANSCRIPT reconstructed from the keylog: the literal text the user typed (Backspace already applied; may be approximate for non-US keyboard layouts or arrow-key edits — read through obvious layout typos like y/z swaps or bracket-for-umlaut), keyboard shortcuts (chords), mouse click/scroll bursts, and the focused application. The transcript is exact ground truth for WHAT WAS TYPED; the frames show WHERE things are and what changed on screen. Mouse positions are not in the transcript — read clicks from the frames.

  Always trust the transcript for typed content (e.g. a chat prompt, a shell command, a search query) and the frames for on-screen state. Report only what the evidence supports; never invent file names, values, or results you cannot see.

# STEP A — perceive frames+transcript into a timeline.
# fields: win_start, win_end, transcript_text, n_frames
perceive: |-
  STEP A — TIMELINE. Produce a fine-grained, time-ordered timeline of what happens between original_t ${win_start}s and ${win_end}s.

  Use the frames AND the input transcript below. For each distinct micro-activity emit one event: the app in focus, and a concrete observation grounded in evidence — what the user did (typed/clicked/ran/scrolled), quoting the actual typed text from the transcript where relevant, and what visibly changed on screen as a result. Note submissions/results (message sent, command output appeared, file saved, page loaded).

  INPUT TRANSCRIPT for this window:
  ${transcript_text}

  ${n_frames} frames attached.

  Return ONLY JSON:
  { "events": [ { "t_start": number, "t_end": number, "app": "string", "observation": "string" } ] }

# STEP B — cut the timeline into goal-coherent task intervals.
# fields: timeline_text, transcript_text, span0, span1
segment: |-
  STEP B — SEGMENT INTO TASKS. Below is a timeline of one recording span and the full input transcript. Cut the span into intervals where EACH interval is exactly ONE goal a user could have requested up front — one achievable intent, not a UI micro-step and not several unrelated tasks bundled together.

  Rules:
  - Boundaries: start an interval at the first action that works toward the goal (skip idle/scrolling-without-purpose before it); end it when the goal's end-state is reached.
  - MONOTONIC: if the user does something, undoes/reverts it, then redoes it (do->undo->redo, failed attempt then retry), DO NOT span the whole mess. Keep only the final sub-interval that cleanly reaches the end-state, and set monotonic=false to flag that you trimmed.
  - AGENT INTERACTIONS are first-class tasks (asking an AI assistant / coding agent like Claude, Cursor, Codex, ChatGPT). Two distinct cases: (a) PROMPT-AND-MOVE-ON: the user composes and submits a request, then moves on — the task is 'prompt the agent', ending right after submission; the agent's eventual answer is NOT required to be on screen. (b) PROMPT-AND-WAIT: the user submits and then waits (idle / no input while the agent streams a reply, runs, or edits) and stays until it finishes — make ONE interval that runs from composing the request THROUGH to where the agent's result is VISIBLE on screen (the completion), idle wait included (that wait is the task, not dead time). Only use case (b) when the result actually becomes visible before the user leaves or the segment ends; if it never does, fall back to case (a) ending at submission. Never make a wait-for-completion interval whose result is never shown.
  - TIGHT BOUNDARIES: an interval starts at the FIRST action that works toward its goal (exclude any preceding idle, reading, or leftover activity from a previous task) and ends AT the achieved end-state (exclude trailing unrelated typing, scrolling, or the start of the next task). An interval must NOT span an application/context switch that begins a different task — cut at the switch. One coherent task, tightly bounded; when unsure where a task ends, cut earlier rather than trailing.
  - Do not pad: idle time, aimless scrolling, app-switching with no task, and incomplete fragments belong to NO interval. Prefer fewer, clean intervals over covering every second.
  - For each interval state the achieved end-state you can actually see/infer from evidence.

  Recording span: ${span0}s to ${span1}s.

  TIMELINE:
  ${timeline_text}

  INPUT TRANSCRIPT:
  ${transcript_text}

  Return ONLY JSON:
  { "intervals": [ { "start_time_s": number, "end_time_s": number, "achieved_state": "string", "monotonic": true|false, "rationale": "string" } ] }

# STEP C — write the user-prompt instruction (hindsight) + register variants.
# fields: start_s, end_s, achieved_state, transcript_text, n_frames
label: |-
  STEP C — WRITE THE USER PROMPT (hindsight). For the ONE task interval from original_t ${start_s}s to ${end_s}s, write the instruction a real person would have typed to make a computer-use agent do this.

  Think of the achieved end-state as the goal, and phrase the request a user would give to reach it.

  HARD RULES for the instruction:
  - It is a REQUEST a user types, an intent — not a narration of UI steps. The agent figures out the clicks/keystrokes itself, so DO NOT list them.
  - BANNED openings/among others: 'In the <app>, ...', 'Open ...', 'Click ...', 'Navigate to ...', step-by-step recipes. Write the goal, e.g. 'why is my training loss NaN-ing?' or 'bump warmup to 100 and resubmit' rather than 'In VS Code open file X and change line Y'.
  - Be grounded: if the task is typing a chat prompt / command / query, the instruction IS essentially that typed content (from the transcript) — use it, lightly cleaned. Never invent specifics not in the evidence.
  - AGENT tasks: if the user is delegating to an AI assistant/coding agent, the instruction is the request itself (the intent). If the interval shows the user then waiting for the agent to finish, that waiting is the correct behavior for this goal — do NOT mention waiting in the instruction; the goal is still just the request/intent.
  - It must be a CLEAR, ACTIONABLE request with a definite goal. A vague aside or status musing ('hm did that work?', 'i believe something completed?') is NOT a task — if that is all the interval contains, return an empty instruction "".
  - It must be issuable from the first frame's state alone. If the actual edit happens somewhere not yet visible (deep in a file, another pane), state the goal at the level the user would phrase it seeing the first frame (what they want changed or achieved), NOT by referencing specific code identifiers, line numbers, or content not visible yet.

  Then give 2 PARAPHRASE VARIANTS at DIFFERENT registers so the data is not homogeneous: e.g. one terse/high-level ('fix the NaN loss') and one more specific ('increase warmup steps and rerun the debug job') — all faithful to the same achieved goal, all still user-prompt style (never recipes).

  Achieved end-state (from step B): ${achieved_state}

  INPUT TRANSCRIPT for this interval:
  ${transcript_text}

  ${n_frames} frames attached (first and last included).

  Return ONLY JSON:
  { "instruction": "string", "instruction_variants": ["string", "string"], "achieved_state": "string", "grounding": "one sentence of evidence" }

# STEP D — verify the instruction against the trajectory + repair boundaries.
# fields: instruction (already repr'd with quotes), start_s, end_s, n_frames
verify: |-
  STEP D — VERIFY + REPAIR. A labeler proposed this instruction for the interval around original_t ${start_s}s to ${end_s}s (the last attached frames may extend a few seconds past the end to capture a streamed/async result):

    INSTRUCTION: ${instruction}

  KEYLOG TRANSCRIPT for this interval (exact ground truth for what was typed):
  ${transcript_text}

  Judge against the frames + transcript ONLY, and judge each axis INDEPENDENTLY of the others.
  - achieved: the instruction's goal is reached by the last frames. Decide which case this interval is and judge accordingly:
     * PROMPT-AND-MOVE-ON (a short interval that ends right after the user submits a request to an agent and switches away): achieved=true once the request was clearly composed and submitted. The agent's answer need NOT be on screen.
     * PROMPT-AND-WAIT (the interval continues with the user idle/waiting for the agent): this is only achieved when the agent's result/response is VISIBLY present (finished) by the last frames — if it is still streaming or the answer never appears, achieved=false (the wait did not reach the result).
     * MANUAL EDIT (rename, set a value, save, delete, send a message): achieved=true only once that change is visibly applied.
    Default to false when the end-state is not clearly reached for the applicable case.
  - monotonic: true when the user works in ONE direction toward the goal. Minor inline self-corrections are NORMAL and count as monotonic: fixing a typo, re-running a command after an error, small backtracks within the same attempt. Only a real reversal breaks it — the user reaches or abandons the goal and then redoes it differently, or makes the change then undoes it. Do NOT mark false for routine corrections, and do NOT mark false merely because the goal is incomplete (that is the 'achieved' axis).
  - boundary_tight: does the interval START at the first action toward this goal and END at the achieved end-state, with little idle/unrelated padding? false if it includes a chunk of a previous or next task, unrelated typing/scrolling, or spans an application/context switch into a different task.
  - grounded: is every specific in the instruction (file names, values, targets, the requested change) supported by the frames or transcript? false if it names something not visible/typed, or asserts a result that is not shown.
  - start_achievable: could a user issue this instruction seeing ONLY the first frame (no dependence on later/off-screen context)?
  - user_prompt_register: does it read like a request a user would TYPE (an intent), NOT a narration of UI steps and NOT starting with 'In the <app>/Open/Click/Navigate'?

  If a TIGHTER sub-interval [a,b] within [start,end] would be cleanly achieved AND monotonic AND boundary_tight, return it in `repair` (times from the frame labels) so it can be trimmed and re-labeled; otherwise repair=null.

  ${n_frames} frames attached.

  Return ONLY JSON:
  { "achieved": bool, "monotonic": bool, "boundary_tight": bool, "grounded": bool, "start_achievable": bool, "user_prompt_register": bool, "evidence": "string", "repair": {"start_time_s": number, "end_time_s": number} | null }

# Independent quality judge (judge.py) — separate model pass that re-scores
# finished examples; deliberately NOT the same prompt as verify.
judge_system: |-
  You are a strict data-quality auditor for a computer-use agent's training set. Each example pairs an INSTRUCTION (what a user types to ask an agent to do something) with the TRAJECTORY a human actually performed (shown as frames, each immediately preceded by a text line giving its time as `original_t=..s`) plus the reconstructed keylog transcript. Judge only against the evidence; be skeptical and default to false when unsure.

# fields: instruction (already repr'd), start_s, end_s, transcript_text
judge: |-
  INSTRUCTION: ${instruction}
  Interval: original_t ${start_s}s to ${end_s}s.

  KEYLOG TRANSCRIPT for the interval:
  ${transcript_text}

  Score each axis as a strict boolean:
  - achieves: the trajectory actually reaches the instruction's goal end-state by the last frame.
  - monotonic: the user works in one direction toward the goal; minor inline self-corrections (typo fixes, re-running after an error, small backtracks within the same attempt) are normal and still count as monotonic. Only a true reversal — reaching/abandoning the goal then redoing it differently, or doing then undoing it — breaks it.
  - boundary_tight: starts at the first action toward the goal and ends at completion, with little idle/unrelated padding.
  - grounded: every specific in the instruction is supported by the frames or transcript (no invented file names, values, or results).
  - user_prompt_register: reads like an intent a user would TYPE, not a narration of UI steps; does not merely recite the clicks.
  Also give an overall score 0-5 and one short note.

  Return ONLY JSON: {"achieves":bool,"monotonic":bool,"boundary_tight":bool,"grounded":bool,"user_prompt_register":bool,"score":number,"note":"string"}
