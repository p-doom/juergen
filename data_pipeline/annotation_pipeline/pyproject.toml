[project]
name = "juergen-data-pipeline-v3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
  "msgpack>=1.1.1",
  "openai>=1.86.0",
  "opencv-python-headless>=4.12.0.88",
  "pillow>=11.3.0",
  # Pinned: 5.2 builds the slow (numpy/PIL) Qwen3-VL image processor torch-free
  # for exact stage-04 token counts. 5.3+ forces the torchvision/torch path,
  # which this venv has no torch for. Do not loosen without re-validating stage 04.
  "transformers==5.2.0",
]

[tool.uv]
package = false
