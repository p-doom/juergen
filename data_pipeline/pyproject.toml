[project]
name = "crowdcast-data-pipeline"
version = "0.1.0"
description = "Crowd-cast SFT data pipeline: pmanager launch configs and tests for the stages in ../pipeline."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "absl-py>=2.0",
    "array-record>=0.5.1",
    "desktop @ git+https://github.com/p-doom/desktop.git@1db6ae2499afc16d87dee15453a57042dff13f64",
    "msgpack>=1.0",
    "numpy>=2.0",
    "openai>=2.26.0",
    "opencv-python-headless>=4.10.0.84",
    "Pillow>=11.3.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["configs"]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
]
ignore = [
    "PLR0912",  # too many branches (stage main() loops are long by design)
    "PLR0913",  # too many arguments (absl-flags entrypoints have many)
    "PLR0915",  # too many statements (per-segment processing loops are long by nature)
    "PLR2004",  # magic value (port numbers, fps, jpeg quality inline are fine)
    "E501",     # line length (enforced by formatter, not lint)
]

[tool.ruff.lint.isort]
known-first-party = [
    "configs",
    "pipeline",
]
