[project]
name = "crowdcast-data-pipeline"
version = "0.1.0"
description = "Crowd-cast SFT data pipeline: pmanager launch configs and tests for the stages in ../pipeline (crowdcast + finevision)."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
# This dep set is the one the stages need — they live at ../pipeline and are
# run from this venv. pmanager itself is loaded by the outer process (the
# `pmanager launch` invocation), not by the stages. The configs here use
# ``from pmanager.configs.schema import …``, but those imports resolve in
# pmanager's own venv, not this one.
#
# Two stages run their work in another venv and so do not contribute here:
# pipeline/crowdcast/stage_05_measure_lengths.py and stage_06_training_records.py
# subprocess-wrap omegalax scripts via ``uv run --project <omegalax_repo>``.
dependencies = [
    "absl-py>=2.0",                # flag-based entrypoints: pipeline/crowdcast/stage_05_measure_lengths.py + stage_06_training_records.py
    "msgpack>=1.0",                # parse per-recording keylog msgpacks: pipeline/crowdcast/lib/{realign,common}.py + stage_02_realign.py
    "Pillow>=11.3.0",              # JPEG encode/decode: pipeline/crowdcast/stage_01_master_frames.py + pipeline/crowdcast/lib/image_store.py
    "numpy>=2.0",                  # frame-array math: pipeline/crowdcast/lib/image_store.py + pipeline/crowdcast/annotation/lib/units.py
    "array-record>=0.5.1",         # ArrayRecord (grain) JPEG image store: pipeline/crowdcast/stage_01_master_frames.py + pipeline/crowdcast/lib/{frames_actions,image_store}.py
    # Floor at 0.5.1 (not 0.6.0) so sglang's diffusion extra — which pins ==0.5.1 — can co-resolve in the workspace lock. Only a PATH fallback; minor version doesn't matter.
    "imageio-ffmpeg>=0.5.1",       # ffmpeg binary lookup: pipeline/crowdcast/lib/config.py
    "openai>=2.26.0",              # VLM labeler (Azure/OpenAI-compatible) + local Qwen: pipeline/crowdcast/annotation/lib/labeler.py
    "PyYAML>=6.0",                 # prompts.yaml loaders: pipeline/crowdcast/annotation/lib/prompts.py
    "opencv-python-headless>=4.10.0.84",  # video probing / frame decode: pipeline/crowdcast/stage_00_clip_manifest.py + pipeline/crowdcast/lib; matches sglang workspace pin
    "tqdm>=4.66",                  # decode progress bar: pipeline/crowdcast/stage_01_master_frames.py
    # The FineVision corpus is a second replay SOURCE, not a crowd-cast stage:
    # pipeline/finevision/prep.py loads the HF dataset and materializes its
    # images, emitting the same chat.jsonl shape stage 04 does. Declared here
    # because that prep runs from this venv, like every stage.
    "datasets>=3.0",               # HF loader: pipeline/finevision/prep.py
    # Unfloored because it is the path-sourced sibling checkout, not an index
    # package. Four stages import `grammars` (via the repo-root sys.path their
    # entrypoints set up) and `grammars` hard-imports desktop, so a stage
    # dispatched against this venv fails at import without it. The suites do not
    # catch that: conftest.py appends the sibling checkout for them.
    "desktop",                     # via grammars: pipeline/crowdcast/stage_03_filter.py + stage_04_build_conversations.py + annotation/stage_annotate.py + annotation/lib/days.py
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Not a published package — pyproject anchors a uv venv at this directory.
# `pipeline/`, `tooling/` and `datasets/` live at the repo root and are not
# packaged (their entrypoints put the repo root on sys.path themselves), so
# `configs` is the only package here.
packages = ["configs"]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
]
ignore = [
    "PLR0912",  # too many branches (stage main() loops are long by design)
    "PLR0913",  # too many arguments (absl-flags entrypoints have many)
    "PLR0915",  # too many statements (per-segment processing loops are long by nature)
    "PLR2004",  # magic value (port numbers, fps, jpeg quality inline are fine)
    "E501",     # line length (enforced by formatter, not lint)
]

[tool.ruff.lint.isort]
known-first-party = [
    "configs",
    # repo-root package reached via sys.path (see conftest.py / stage entrypoints)
    "pipeline",
]
