[project]
name = "crowdcast-data-pipeline"
version = "0.1.0"
description = "Crowd-cast SFT data pipeline: pmanager launch configs and tests for the stages in ../pipeline."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
# This dep set is the one the STAGES need — they live at ../pipeline and are
# run from this venv. pmanager itself is loaded by the *outer* process (the
# `pmanager launch` invocation), not by the stages. The configs here use
# ``from pmanager.configs.schema import …``, but those imports resolve in
# pmanager's own venv, not this one.
#
# Two stages deliberately run work in ANOTHER venv and so do not contribute
# here: pipeline/stage_05_measure_lengths.py and stage_06_training_records.py
# subprocess-wrap omegalax scripts via ``uv run --project <omegalax_repo>``.
dependencies = [
    "absl-py>=2.0",                # flag-based entrypoints: pipeline/stage_05_measure_lengths.py + stage_06_training_records.py
    "msgpack>=1.0",                # parse per-recording keylog msgpacks: pipeline/lib/{realign,common}.py + stage_02_realign.py
    "Pillow>=11.3.0",              # JPEG encode/decode: pipeline/stage_01_master_frames.py + pipeline/lib/image_store.py
    "numpy>=2.0",                  # frame-array math: pipeline/lib/image_store.py + pipeline/annotation/lib/units.py
    "array-record>=0.5.1",         # ArrayRecord (grain) JPEG image store: pipeline/stage_01_master_frames.py + pipeline/lib/{frames_actions,image_store}.py
    # Floor at 0.5.1 (not 0.6.0) so sglang's diffusion extra — which pins ==0.5.1 — can co-resolve in the workspace lock. Only a PATH fallback; minor version doesn't matter.
    "imageio-ffmpeg>=0.5.1",       # ffmpeg binary lookup: pipeline/lib/config.py
    "openai>=2.26.0",              # VLM labeler (Azure/OpenAI-compatible) + local Qwen: pipeline/annotation/lib/labeler.py
    "PyYAML>=6.0",                 # prompts.yaml loaders: pipeline/annotation/lib/prompts.py
    "opencv-python-headless>=4.10.0.84",  # video probing / frame decode: pipeline/stage_00_clip_manifest.py + pipeline/lib; matches sglang workspace pin
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Not a published package — pyproject anchors a uv venv at this directory.
# `pipeline/`, `tooling/` and `datasets/` live at the REPO ROOT and are
# deliberately NOT packaged (sys.path-hacked entrypoints, as before);
# `goal_timeline_viewer/` (manual-annotation tooling, never ground truth) has
# since moved out of this repo entirely, to the slurm repo
# (dev/franz/berlin/crowd-cast-bc/goal_timeline_viewer/) — same for
# `visualize_run.py` and `tooling/labctl/recipes/` (dispatch, not code; see
# dev/franz/berlin/crowd-cast-bc/labctl/recipes/eval/). None had an
# __init__.py, so none were ever subpackages and this list needed no change
# for any of these moves.
#
# `configs` is all that is left to package: the annotation_pipeline generation
# was deleted 2026-08-06 and the stage_[a-d] configs that used its directory as
# a repo-root sentinel went with it. chain_annotate.py and chain_train.py assert
# a root `pipeline/` instead, which is where the stages actually live.
packages = ["configs"]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
]
ignore = [
    "PLR0912",  # too many branches (stage main() loops are long by design)
    "PLR0913",  # too many arguments (absl-flags entrypoints have many)
    "PLR0915",  # too many statements (per-segment processing loops are long by nature)
    "PLR2004",  # magic value (port numbers, fps, jpeg quality inline are fine)
    "E501",     # line length (enforced by formatter, not lint)
]

[tool.ruff.lint.isort]
known-first-party = [
    "configs",
    # repo-root package reached via sys.path (see conftest.py / stage entrypoints)
    "pipeline",
]
