[project]
name = "crowdcast-data-pipeline"
version = "0.1.0"
description = "Crowd-cast SFT data pipeline (stages: prepare, run_length_cap, grain_payload, chunk_index). Configs consumed by pmanager."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
# Entrypoints only — pmanager itself is loaded by the *outer* process (the
# `pmanager launch` invocation), not by these stage scripts. Configs in
# this project use ``from pmanager.configs.schema import …``, but those
# imports resolve in pmanager's own venv, not here.
#
# Several scripts in this repo deliberately run inside OTHER venvs and
# therefore do NOT contribute to this dep set:
#   * filter_truncated.py — runs under omegalax's uv venv (uses its pinned
#     transformers + Qwen3-VL fast tokenizer).
#   * stage_c_grain_payload.py / stage_d_chunk_index.py — subprocess-wrap
#     omegalax scripts via ``uv run --project <omegalax_repo>``.
#   * generate_onpolicy_completions{,_mm}.py / _smoke_mm_sglang.py — run
#     under the crowdcast-eval venv (sglang + openai client live there).
dependencies = [
    "absl-py>=2.0",                # flag-based entrypoints across every stage_*.py / prep_*.py
    "msgpack>=1.0",                # stage A: parse per-recording keylog msgpacks
    "Pillow>=11.3.0",              # stage A JPEG encode + prep_finevision image materialization
    "numpy>=2.0",                  # stage A frame-array math
    "array-record>=0.5.1",         # ArrayRecord (grain) JPEG image store: stage_01 pack + migration + ar:// decode
    # Floor at 0.5.1 (not 0.6.0) so sglang's diffusion extra — which pins ==0.5.1 — can co-resolve in the workspace lock. Only a PATH fallback; minor version doesn't matter.
    "imageio-ffmpeg>=0.5.1",
    # The next three are needed by BOTH annotation_pipeline (legacy) and
    # pipeline/ (current), so none of them dies with the legacy package.
    "openai>=2.26.0",              # VLM labeler (Azure/OpenAI-compatible) + local Qwen: annotation_pipeline/labeler.py, pipeline/annotation/lib/labeler.py
    "PyYAML>=6.0",                 # prompts.yaml loaders: annotation_pipeline/prompts.py, pipeline/annotation/lib/prompts.py
    "opencv-python-headless>=4.10.0.84",  # video probing / frame decode: pipeline/stage_00_clip_manifest.py + pipeline/lib, annotation_pipeline/frames_render.py; matches sglang workspace pin
    "datasets>=3.0",               # prep_{finevision,smoltalk2,tulu3_persona_if} + preprocess_smoltalk_prompts HF loaders
    # tokenizer for prompt-length filtering in preprocess_smoltalk_prompts.py
    # (Qwen3-VL-2B chat template).
    "transformers>=4.45",
    # transformers' chat-template renderer pulls jinja2 lazily; needed so
    # apply_chat_template doesn't ImportError on first call.
    "jinja2>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Not a published package — pyproject anchors a uv venv at this directory.
# `pipeline/`, `tooling/` and `datasets/` live at the REPO ROOT and are
# deliberately NOT packaged (sys.path-hacked entrypoints, as before);
# `goal_timeline_viewer/` moved to ../tooling/ WITHOUT affecting this list — it
# has no __init__.py, so it was never a subpackage and was never installed.
#
# `annotation_pipeline` is the SUPERSEDED generation and is on notice. Nothing
# outside it imports it any more: the two modules with external callers are now
# thin aliases over the ported implementations
#   annotation_pipeline.build_manifest                -> pipeline.stage_00_clip_manifest
#   annotation_pipeline.stage_04_build_canonical_sft  -> pipeline.stage_04_build_canonical_sft
# and exist only so recorded labctl `submit.sh` scripts and the in-package
# `build_sft.py` driver keep resolving. It stays in `packages` (a) because it is
# still on disk and importable by design, and (b) because configs/stage_[a-d]_v1_*
# assert `annotation_pipeline/` exists as their "this is a data_pipeline root"
# sentinel — retarget that sentinel before dropping this entry.
packages = ["annotation_pipeline", "configs"]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
]
ignore = [
    "PLR0912",  # too many branches (stage main() loops are long by design)
    "PLR0913",  # too many arguments (absl-flags entrypoints have many)
    "PLR0915",  # too many statements (per-segment processing loops are long by nature)
    "PLR2004",  # magic value (port numbers, fps, jpeg quality inline are fine)
    "E501",     # line length (enforced by formatter, not lint)
]

[tool.ruff.lint.isort]
known-first-party = [
    "_manifest",
    "configs",
    "annotation_pipeline",
    # repo-root packages reached via sys.path (see conftest.py / stage entrypoints)
    "pipeline",
    "filter_truncated",
    "generate_onpolicy_completions",
    "generate_onpolicy_completions_mm",
    "prep_finevision",
    "prep_smoltalk2",
    "prep_tulu3_persona_if",
    "preprocess_smoltalk_prompts",
    "stage_a_prepare",
    "stage_b_run_length_cap",
    "stage_c_grain_payload",
    "stage_d_chunk_index",
]
