[project]
name = "crowdcast-rft"
version = "0.1.0"
description = """\
Production RFT (rejection fine-tuning) infrastructure: the five reusable, tested \
stages (sample / score / build-records / train / evaluate) plus the cross-cutting \
guards (reward semantics, action grammars, action-span conversion, arm parity, \
within-record label leakage, prediction diagnostics, reference anchors, provenance). \
Consumed by labctl recipes under rft/labctl/recipes/. omegalax and the eval harnesses \
are NOT reimplemented here - this package owns the glue around them."""
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

# Deliberately dependency-free on the hot path. Every guard in this package is pure
# stdlib so it can run in ANY of the cluster's mutually-incompatible venvs (omegalax's
# JAX env, the eval env's torch/sglang closure, prime-rl's vLLM closure) without
# dragging a dependency into it. The only optional imports are:
#   * requests  - real HTTP for rft.serving.preflight_chat_completion (injected in tests)
#   * wandb     - rft.wandb_offline's datastore reader (offline .wandb files)
# Both are imported lazily inside the function that needs them, so importing `rft`
# never requires them.
dependencies = []

[project.optional-dependencies]
serving = ["requests>=2.31"]
wandb = ["wandb>=0.17"]
dev = ["pytest>=8.0"]

[project.scripts]
rft = "rft.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test class in this suite gates a NUMBERED defect (see README.md). The names
# carry the defect number so a failure says which confidently-wrong conclusion just
# became reachable again.
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "TID", "PTH", "RET", "C4", "N",
]
ignore = [
    "PLR0912",  # too many branches (stage orchestration is branchy by nature)
    "PLR0913",  # too many arguments (stage entry points have many knobs, all named)
    "PLR0915",  # too many statements
    "PLR2004",  # magic value (thresholds are documented inline next to their anchor)
    "E501",     # line length (enforced by the formatter)
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reproduce the defective pattern before showing the guard fire;
# that means unused lambdas, broad excepts and long fixtures are the point.
"tests/*" = ["B008", "B023", "BLE001", "PLR2004", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["rft"]
