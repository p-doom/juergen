# Off-the-shelf Qwen3-VL-4B-Instruct, native_absolute. Prior single-trial reading: 4/4.
#
# `provenance.repo_path`, NOT the staged snapshot: labctl stages one repo and this
# one has a sibling path dependency (`desktop-env = { path = "../desktop-env" }`,
# no remote, no recorded commit) that cannot resolve inside a snapshot. See
# tooling/labctl/recipes/README.md before changing this.
name = "solv2r_offshelf_4b_native_gpu_kvm"
repo = "juergen"
command = ["bash", "-c", '''
set -euo pipefail
SOURCE="$(jq -er '.provenance.repo_path' "$LABCTL_CONTEXT")"
DESKTOP_ENV="$(jq -er '.inputs[] | select(.role == "desktop_env") | .resolved_path' "$LABCTL_CONTEXT")"
RUNTIME="$(jq -er '.inputs[] | select(.role == "runtime") | .resolved_path' "$LABCTL_CONTEXT")"
cd "$SOURCE"
[[ -r /dev/kvm && -w /dev/kvm ]] || { echo "FATAL /dev/kvm unavailable" >&2; exit 2; }
[[ -n "${CUDA_VISIBLE_DEVICES:-}" ]] || { echo "FATAL model GPU allocation missing" >&2; exit 2; }
[[ -x "$CUDA_HOME/bin/nvcc" ]] || { echo "FATAL CUDA compiler missing at $CUDA_HOME/bin/nvcc" >&2; exit 2; }
for arg in "$@"; do
  case "$arg" in
    --qcow=*|--qemu=*)
      [[ -e "${arg#*=}" ]] || { echo "FATAL ${arg%%=*} does not exist: ${arg#*=}" >&2; exit 2; } ;;
    --model-path=*)
      [[ -f "${arg#*=}/config.json" ]] || { echo "FATAL --model-path has no config.json: ${arg#*=} -- labctl checkpoint exports nest the HF files under hf/, a raw HF hub snapshot does not" >&2; exit 2; } ;;
  esac
done
# labctl records juergen's HEAD and diff; it records NOTHING about the sibling
# checkout, so the only place desktop-env's identity exists is this line.
echo "PROVENANCE juergen     $(git -C "$SOURCE" rev-parse HEAD) dirty=$(git -C "$SOURCE" status --porcelain | wc -l)"
echo "PROVENANCE desktop-env $(git -C "$DESKTOP_ENV" rev-parse HEAD) dirty=$(git -C "$DESKTOP_ENV" status --porcelain | wc -l)"
export PYTHONPATH="$SOURCE:$DESKTOP_ENV"
export XDG_CACHE_HOME="$LABCTL_RUN_DIR/.cache"
mkdir -p "$XDG_CACHE_HOME"
mkdir -p "$XDG_CACHE_HOME/inductor" "$XDG_CACHE_HOME/triton"
export FLASHINFER_WORKSPACE_BASE="$XDG_CACHE_HOME"
export TORCHINDUCTOR_CACHE_DIR="$XDG_CACHE_HOME/inductor" TRITON_CACHE_DIR="$XDG_CACHE_HOME/triton"
exec "$RUNTIME/bin/python" -m evals.signoflife "$@"
''', "--"]

[resources]
gpus = 1
cpus = 8
mem = "64GB"
time = "04:00:00"
qos = "normal"
account = "hfmi_synergyunit"
partition = "standard"
# Pinned, not excluded. Controls and model arms must share a host: the published
# comparison this run re-baselines had its controls on hai003 and arm D on hai002,
# so control conformance was never established on the measurement node.
sbatch_extra = ["--no-requeue", "--ntasks=1", "--ntasks-per-node=1", "--nodelist=hai003"]

[inputs.desktop_env]
# The sibling checkout labctl cannot stage. Declared so the resolved path is in the
# run context; the commit itself only reaches the record via the PROVENANCE line.
type = "external"
path = "/fast/home/franz.srambical/desktop-env"

[inputs.vm]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/osworld_vm"

[inputs.qemu]
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/qemu"

[inputs.runtime]
# Prebuilt, CUDA-free: verifiers 0.2.1 + the harness's pure-python deps. Built with
# `uv venv` + `uv pip install --python`, never a project-mode sync against a shared
# .venv.
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/venvs/juergen-testgate-venv"

[inputs.sglang]
# Only ever spawned as `--sglang-python <this>/bin/python -m sglang.launch_server`.
# The harness never imports from it, and it is NOT mutated to add verifiers: it is a
# recorded input of finished runs, and changing it would change what those mean.
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/franz/sign_of_life_eval_v2_venv/.venv"

[inputs.model]
# Raw HF hub cache snapshot: config.json etc. live directly under this dir, unlike
# the labctl checkpoint exports the other arms point at (which nest the HF-format
# files under `hf/`). Do NOT append `/hf` to model-path below for this input.
type = "external"
path = "/fast/project/HFMI_SynergyUnit/p-doom_shared/huggingface/hub/models--Qwen--Qwen3-VL-4B-Instruct/snapshots/ebb281ec70b05090aa6165b016eac8ec08e71b17"

[outputs.result]
type = "eval_result"
marker = "result.json"
alias = "solv2r_offshelf_4b_native_gpu_kvm_{run.id}"

[args]
arm = "offshelf_native"
output = "{outputs.result.path}"
trials = "3"
qcow = "{inputs.vm.path}/Ubuntu.qcow2"
qemu = "{inputs.qemu.path}/bin/qemu-system-x86_64-wrapped"
vm-smp = "4"
vm-mem = "8G"
model-path = "{inputs.model.path}"
sglang-python = "{inputs.sglang.path}/bin/python"
sglang-port = "0"
sglang-mem-fraction = "0.65"
temperature = "0.0"
top-p = "1.0"
max-tokens = "256"

[env]
PYTHONUNBUFFERED = "1"
CUDA_HOME = "/fast/service/apps/software/CUDA/12.6.0"
